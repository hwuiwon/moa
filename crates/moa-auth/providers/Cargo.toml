[package]
name = "moa-auth-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
auth0 = ["dep:moa-auth-providers-auth0"]

[dependencies]
argon2.workspace = true
async-trait.workspace = true
blake3.workspace = true
chrono = { workspace = true, features = ["serde"] }
crc32fast.workspace = true
jsonwebtoken.workspace = true
moa-authz.workspace = true
moa-authz-schema.workspace = true
moa-auth-providers-auth0 = { workspace = true, optional = true }
moa-core.workspace = true
moa-observability.workspace = true
moka.workspace = true
rand.workspace = true
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"] }
strum.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
workspace-hack = { workspace = true }

[dev-dependencies]
moa-migrations.workspace = true
reqwest.workspace = true
serde_json.workspace = true
