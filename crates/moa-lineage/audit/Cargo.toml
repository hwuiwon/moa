[package]
name = "moa-lineage-audit"
version = "0.1.0"
edition = "2024"

[dependencies]
moa-lineage-core = { path = "../core" }
base64.workspace = true
blake3.workspace = true
ct-merkle = "0.2"
ed25519-dalek = { workspace = true, features = ["pem", "pkcs8"] }
async-trait = { workspace = true }
aes-gcm = "0.10"
hmac = "0.12"
sha2.workspace = true
zip = "2"
tokio = { workspace = true, features = ["fs", "rt", "macros", "sync", "time"] }
tokio-util = { workspace = true }
sqlx = { workspace = true, features = ["tls-rustls", "chrono", "uuid", "json"] }
object_store.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_canonical_json.workspace = true
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
hex.workspace = true
serde_json.workspace = true
tempfile.workspace = true
