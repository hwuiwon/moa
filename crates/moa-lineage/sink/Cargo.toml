[package]
name = "moa-lineage-sink"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
blake3.workspace = true
chrono.workspace = true
clickhouse.workspace = true
metrics.workspace = true
moa-core = { workspace = true }
moa-wire = { workspace = true }
moa-config = { workspace = true }
moa-lineage-core = { workspace = true }
moa-memory-types = { workspace = true }
opentelemetry.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sqlx = { workspace = true, features = ["tls-rustls", "chrono", "json", "uuid"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
uuid.workspace = true
workspace-hack = { workspace = true }

[dev-dependencies]
moa-migrations = { workspace = true }
# Renders real Prometheus output through a LOCAL recorder, so the writer-state
# gauge can be asserted as an operator's alert would read it rather than through
# a hand-rolled stand-in that cannot show a latched series.
metrics-exporter-prometheus.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-subscriber = { workspace = true }
