[package]
name = "moa-edge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
auth0 = ["moa-auth-providers/auth0"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["multipart"] }
base64.workspace = true
chrono.workspace = true
clap = { workspace = true, features = ["env"] }
futures-util.workspace = true
hex.workspace = true
hmac.workspace = true
moa-analytics.workspace = true
moa-auth-providers.workspace = true
moa-authz.workspace = true
moa-authz-schema.workspace = true
moa-core.workspace = true
moa-config.workspace = true
moa-wire.workspace = true
moa-execution.workspace = true
moa-db.workspace = true
moa-lineage-audit.workspace = true
moa-lineage-sink.workspace = true
moa-messaging = { workspace = true, features = ["postmark"] }
moa-observability.workspace = true
moa-ocsf.workspace = true
moa-session.workspace = true
reqwest.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
secrecy.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
workspace-hack = { workspace = true }

[dev-dependencies]
chrono.workspace = true

[[bin]]
name = "moa-edge"
path = "src/main.rs"
