[package]
name = "moa-orchestrator-local"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
moa-brain = { path = "../moa-brain" }
moa-core = { path = "../moa-core" }
moa-hands = { path = "../moa-hands" }
moa-lineage-sink = { path = "../moa-lineage/sink" }
memory-ingest = { package = "moa-memory-ingest", path = "../moa-memory/ingest" }
moa-providers = { path = "../moa-providers" }
moa-session = { path = "../moa-session" }

async-trait.workspace = true
chrono.workspace = true
sqlx = { workspace = true, features = ["tls-rustls", "uuid", "chrono"] }
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tokio-cron-scheduler = "0.13"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
async-trait.workspace = true
moa-test-support.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }
