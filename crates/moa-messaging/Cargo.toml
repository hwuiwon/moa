[package]
name = "moa-messaging"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["slack", "postmark", "twilio"]
postmark = ["dep:reqwest"]
slack = ["dep:slack-morphism"]
twilio = ["dep:reqwest"]

[dependencies]
moa-core = { workspace = true }
moa-observability = { workspace = true }
async-trait.workspace = true
chrono.workspace = true
moka.workspace = true
rand.workspace = true
reqwest = { workspace = true, optional = true }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-segmentation = "1.13"
uuid.workspace = true
slack-morphism = { version = "2.19.0", features = ["hyper"], optional = true }
workspace-hack = { workspace = true }

[dev-dependencies]
base64.workspace = true
moa-runtime-store.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing"] }
reqwest.workspace = true
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
wiremock.workspace = true
