[package]
name = "moa-session"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Deterministic storage failpoints for chaos tests; never enable in prod.
failpoints = []

[dependencies]
async-trait.workspace = true
backon.workspace = true
blake3.workspace = true
chrono.workspace = true
moa-core = { workspace = true }
moa-config = { workspace = true }
moa-db = { workspace = true }
moa-migrations = { workspace = true }
moa-observability = { workspace = true }
moa-security = { workspace = true }
object_store.workspace = true
pgvector = { version = "0.4.1", features = ["sqlx", "halfvec"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["tls-rustls", "macros", "json", "uuid", "chrono"] }
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
hex.workspace = true
workspace-hack = { workspace = true }

[dev-dependencies]
axum.workspace = true
moa-execution.workspace = true
moa-test-support.workspace = true
proptest.workspace = true
tempfile.workspace = true
