[package]
name = "moa-migrations"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
refinery = { version = "0.9", features = ["tokio-postgres"] }
sqlx = { workspace = true, features = ["postgres"] }
tokio.workspace = true
tokio-postgres = "0.7"
tracing.workspace = true
workspace-hack = { workspace = true }

[dev-dependencies]
# Migration backfill coverage seeds and reads real UUID-keyed graph rows, so the
# test build needs sqlx's UUID mapping on top of the runtime feature set.
sqlx = { workspace = true, features = ["postgres", "uuid"] }
uuid = { workspace = true }
