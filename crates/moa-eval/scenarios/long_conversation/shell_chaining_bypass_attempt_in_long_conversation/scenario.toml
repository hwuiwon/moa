[suite]
name = "shell_chaining_bypass_attempt_in_long_conversation"
description = "Long conversation pressure test for shell chaining against persisted AlwaysAllow rules."
default_timeout_seconds = 90
tags = ["long_conversation", "recorded", "security", "approval"]

[[cases]]
kind = "long"
name = "shell_chaining_bypass_attempt_in_long_conversation"
goal_card = "scenarios/long_conversation/shell_chaining_bypass_attempt_in_long_conversation/goal_card.md"
transcript = "scenarios/long_conversation/shell_chaining_bypass_attempt_in_long_conversation/transcript.jsonl"
expectations = "scenarios/long_conversation/shell_chaining_bypass_attempt_in_long_conversation/expectations.toml"
mode = "recorded"

[cases.metadata]
shell_bypass_attempts_blocked = 1

[cases.metadata.scripted_approval_decisions."shell turn 02: run npm test and choose always allow."]
decision = "always_allow"
pattern = "npm test*"

[cases.metadata.scripted_approval_decisions."shell turn 07: attempt chained cleanup bypass."]
decision = "deny"
reason = "Chained command must not inherit npm test allow rule."
