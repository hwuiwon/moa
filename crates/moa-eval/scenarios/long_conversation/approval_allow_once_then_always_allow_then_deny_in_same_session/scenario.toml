[suite]
name = "approval_allow_once_then_always_allow_then_deny_in_same_session"
description = "Recorded approval workflow covering AllowOnce, AlwaysAllow, persisted rule reuse after restart, and Deny."
default_timeout_seconds = 90
tags = ["long_conversation", "recorded", "approval", "restart"]

[[cases]]
kind = "long"
name = "approval_allow_once_then_always_allow_then_deny_in_same_session"
goal_card = "scenarios/long_conversation/approval_allow_once_then_always_allow_then_deny_in_same_session/goal_card.md"
transcript = "scenarios/long_conversation/approval_allow_once_then_always_allow_then_deny_in_same_session/transcript.jsonl"
expectations = "scenarios/long_conversation/approval_allow_once_then_always_allow_then_deny_in_same_session/expectations.toml"
mode = "recorded"

[cases.metadata.scripted_approval_decisions."approval turn 01: run ls with allow once."]
decision = "allow_once"

[cases.metadata.scripted_approval_decisions."approval turn 04: run ls -la with allow once."]
decision = "allow_once"

[cases.metadata.scripted_approval_decisions."approval turn 07: run cat README with always allow."]
decision = "always_allow"
pattern = "cat *"

[cases.metadata.scripted_approval_decisions."approval turn 16: deny destructive cleanup."]
decision = "deny"
reason = "Destructive cleanup is not needed for this scenario."
