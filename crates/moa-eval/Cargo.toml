[package]
name = "moa-eval"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
langfuse = ["dep:reqwest"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
futures-util.workspace = true
moa-brain = { path = "../moa-brain" }
moa-core = { path = "../moa-core" }
moa-hands = { path = "../moa-hands" }
moa-lineage-core = { path = "../moa-lineage/core" }
moa-memory-graph = { path = "../moa-memory/graph" }
moa-memory-ingest = { path = "../moa-memory/ingest" }
moa-memory-pii = { path = "../moa-memory/pii" }
moa-memory-vector = { path = "../moa-memory/vector" }
moa-providers = { path = "../moa-providers" }
moa-security = { path = "../moa-security" }
moa-session = { path = "../moa-session" }
opentelemetry.workspace = true
regex.workspace = true
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["tls-rustls", "chrono", "uuid", "json"] }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
uuid.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
moa-test-support = { path = "../moa-test-support" }
tempfile.workspace = true
