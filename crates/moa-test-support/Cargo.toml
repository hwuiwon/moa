[package]
name = "moa-test-support"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
integration = ["orchestrator-fixture"]
# Just the in-process MCP capability fixture: no Docker, Restate, or Postgres.
# Split out so connector-catalog staging tests can drive scripted connector
# outcomes without pulling the whole orchestrator harness into their build.
capability-fixture = ["dep:axum", "dep:reqwest"]
orchestrator-fixture = [
    "capability-fixture",
    "dep:axum",
    "dep:moa-authz",
    "dep:moa-authz-schema",
    "dep:moa-execution",
    "dep:moa-migrations",
    "dep:nix",
    "dep:opentelemetry-proto",
    "dep:prost",
    "dep:reqwest",
    "dep:testcontainers",
    "dep:url",
]

[dependencies]
anyhow.workspace = true
axum = { workspace = true, optional = true }
chrono.workspace = true
moa-authz = { workspace = true, optional = true }
moa-authz-schema = { workspace = true, optional = true }
moa-core = { workspace = true }
moa-wire = { workspace = true }
moa-execution = { workspace = true, optional = true }
moa-migrations = { workspace = true, optional = true }
moa-security = { workspace = true }
moa-session = { workspace = true }
nix = { version = "0.29", features = ["signal", "process"], optional = true }
opentelemetry-proto = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["tls-rustls", "json", "uuid", "chrono"] }
testcontainers = { workspace = true, optional = true }
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url = { workspace = true, optional = true }
uuid.workspace = true
workspace-hack = { workspace = true }
