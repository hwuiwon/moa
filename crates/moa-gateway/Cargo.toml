[package]
name = "moa-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["discord", "slack", "telegram"]
discord = ["dep:serenity"]
telegram = ["dep:teloxide"]
slack = ["dep:slack-morphism"]

[dependencies]
moa-core = { workspace = true }
async-trait.workspace = true
chrono.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-segmentation = "1.13"
uuid.workspace = true
teloxide = { version = "0.17", default-features = false, features = ["ctrlc_handler", "rustls"], optional = true }
slack-morphism = { version = "2.19.0", features = ["hyper"], optional = true }
serenity = { version = "0.12.5", default-features = false, features = ["builder", "client", "gateway", "http", "model", "rustls_backend"], optional = true }
workspace-hack = { workspace = true }

[dev-dependencies]
insta.workspace = true
moa-test-support.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-test = "0.4"
wiremock.workspace = true
