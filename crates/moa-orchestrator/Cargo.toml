[package]
name = "moa-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
integration = []
auth0 = ["moa-auth-providers/auth0"]
internal-eval-runner = [
    "dep:moa-eval",
    "moa-brain/eval-harness",
    "moa-skills/internal-eval-runner",
]
langfuse = ["internal-eval-runner", "moa-eval/langfuse"]

[[bin]]
name = "moa-orchestrator-bin"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
blake3.workspace = true
chrono.workspace = true
chrono-tz = "0.10"
clap.workspace = true
croner = "2.2"
ed25519-dalek.workspace = true
flate2 = "1"
hex.workspace = true
moa-authz.workspace = true
moa-authz-schema.workspace = true
moa-auth-providers.workspace = true
moa-brain = { workspace = true }
moa-core = { workspace = true }
moa-eval-core = { workspace = true }
moa-eval = { workspace = true, optional = true }
moa-hands = { workspace = true }
moa-lineage-audit = { workspace = true }
moa-lineage-core = { workspace = true }
moa-lineage-sink = { workspace = true }
moa-memory-graph = { workspace = true }
moa-memory-lifecycle = { workspace = true }
moa-memory-vector = { workspace = true }
moa-ocsf.workspace = true
moa-security = { workspace = true }
moa-memory-ingest = { workspace = true }
moa-providers = { workspace = true, features = ["test-util"] }
moa-session = { workspace = true }
moa-skills = { workspace = true }
restate-sdk.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["tls-rustls", "migrate", "json", "uuid", "chrono"] }
tar = "0.4"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
uuid.workspace = true
workspace-hack = { workspace = true }

[dev-dependencies]
moa-test-support.workspace = true
serde_canonical_json.workspace = true
tempfile.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }
