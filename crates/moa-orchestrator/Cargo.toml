[package]
name = "moa-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "moa-orchestrator-bin"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
moa-brain = { path = "../moa-brain" }
moa-core = { path = "../moa-core" }
moa-hands = { path = "../moa-hands" }
memory-ingest = { package = "moa-memory-ingest", path = "../moa-memory/ingest" }
moa-providers = { path = "../moa-providers" }
moa-session = { path = "../moa-session" }
opentelemetry.workspace = true
restate-sdk.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["tls-rustls", "migrate", "json", "uuid", "chrono"] }
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
uuid.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
moa-test-support.workspace = true
serde_canonical_json.workspace = true
tempfile.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }
