[package]
name = "moa-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
integration = []
auth0 = ["moa-auth-providers/auth0"]
langfuse = ["moa-eval/langfuse"]

[[bin]]
name = "moa-orchestrator-bin"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
blake3.workspace = true
chrono.workspace = true
chrono-tz = "0.10"
clap.workspace = true
croner = "2.2"
ed25519-dalek.workspace = true
flate2 = "1"
hex.workspace = true
moa-authz.workspace = true
moa-authz-schema.workspace = true
moa-auth-providers.workspace = true
moa-brain = { path = "../moa-brain" }
moa-core = { path = "../moa-core" }
moa-eval = { path = "../moa-eval" }
moa-hands = { path = "../moa-hands" }
moa-lineage-audit = { path = "../moa-lineage/audit" }
moa-lineage-core = { path = "../moa-lineage/core" }
moa-lineage-sink = { path = "../moa-lineage/sink" }
moa-memory-graph = { path = "../moa-memory/graph" }
moa-memory-lifecycle = { path = "../moa-memory/lifecycle" }
moa-memory-vector = { path = "../moa-memory/vector" }
moa-ocsf.workspace = true
memory-ingest = { package = "moa-memory-ingest", path = "../moa-memory/ingest" }
moa-providers = { path = "../moa-providers", features = ["test-util"] }
moa-session = { path = "../moa-session" }
moa-skills = { path = "../moa-skills" }
restate-sdk.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["tls-rustls", "migrate", "json", "uuid", "chrono"] }
tar = "0.4"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
uuid.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
moa-test-support.workspace = true
serde_canonical_json.workspace = true
tempfile.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }
