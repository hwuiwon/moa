[package]
name = "moa-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
integration = ["moa-security/test-support"]
auth0 = ["moa-auth-providers/auth0"]
provider-overrides = ["moa-providers/scripted-provider"]
# Deterministic execution-planning fault hooks used only by service E2E fixtures.
execution-planning-failpoints = ["moa-session/failpoints"]
slack = ["moa-messaging/slack"]
postmark = ["moa-messaging/postmark"]
twilio = ["moa-messaging/twilio"]

[[bin]]
name = "moa-orchestrator-bin"
path = "src/main.rs"

[[test]]
name = "agent_revision_simulation_db_memory"
path = "tests/agent_revision_simulation_db_memory.rs"

[[test]]
name = "experiment_service"
path = "tests/experiment_service.rs"

[[test]]
name = "experiment_trial_run_e2e"
path = "tests/experiment_trial_run_e2e.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
blake3.workspace = true
chrono.workspace = true
chrono-tz = "0.10"
clap.workspace = true
croner = "2.2"
ed25519-dalek.workspace = true
flate2 = "1"
futures-util.workspace = true
hex.workspace = true
hmac.workspace = true
moa-authz.workspace = true
moa-authz-schema.workspace = true
moa-auth-providers.workspace = true
moa-agents.workspace = true
moa-analytics.workspace = true
moa-analytics-export = { workspace = true }
moa-artifacts.workspace = true
moa-brain.workspace = true
moa-retrieval = { workspace = true }
moa-contacts = { workspace = true }
moa-core = { workspace = true }
moa-wire = { workspace = true }
moa-config = { workspace = true }
moa-connectors = { workspace = true }
moa-crypto = { workspace = true }
moa-kms = { workspace = true }
moa-execution = { workspace = true }
moa-db = { workspace = true }
moa-eval-core = { workspace = true }
moa-eval = { workspace = true }
moa-experiments = { workspace = true }
moa-hands = { workspace = true }
moa-knowledge = { workspace = true }
moa-lineage-audit = { workspace = true }
moa-lineage-citation = { workspace = true }
moa-lineage-core = { workspace = true }
moa-lineage-sink = { workspace = true }
moa-memory-graph = { workspace = true }
moa-memory-pii = { workspace = true }
moa-memory-lifecycle = { workspace = true }
moa-memory-types = { workspace = true }
moa-memory-vector = { workspace = true }
moa-messaging.workspace = true
moa-observability = { workspace = true }
moa-ocsf.workspace = true
moa-security = { workspace = true }
moa-memory-ingest = { workspace = true }
moa-migrations = { workspace = true }
metrics.workspace = true
moa-providers = { workspace = true }
moa-runtime-store = { workspace = true, features = ["redis"] }
moa-session = { workspace = true }
moa-skills = { workspace = true }
restate-sdk.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["tls-rustls", "json", "uuid", "chrono"] }
subtle.workspace = true
tar = "0.4"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
uuid.workspace = true
workspace-hack = { workspace = true }

[dev-dependencies]
moa-artifacts = { workspace = true, features = ["test-support"] }
clickhouse = { workspace = true, features = ["test-util"] }
moa-analytics-export = { workspace = true }
moa-eval-core.workspace = true
moa-test-support = { workspace = true, features = ["connector-api-fixture", "orchestrator-fixture"] }
tempfile.workspace = true
wiremock.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }
