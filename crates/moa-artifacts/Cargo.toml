[package]
name = "moa-artifacts"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Fixture helpers for tests in other crates. Enable through dev-dependencies only.
test-support = []

[dependencies]
blake3.workspace = true
chrono.workspace = true
moa-core.workspace = true
moa-db.workspace = true
pgvector = { version = "0.4.1", features = ["sqlx", "halfvec"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["chrono", "json", "uuid"] }
thiserror.workspace = true
uuid.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
moa-artifacts = { workspace = true, features = ["test-support"] }
jsonschema = { version = "0.47.0", default-features = false }
moa-session.workspace = true
tokio.workspace = true
