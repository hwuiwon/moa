[package]
name = "moa-brain"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
eval-harness = []

[dependencies]
async-trait.workspace = true
blake3.workspace = true
chrono.workspace = true
metrics.workspace = true
moa-artifacts = { workspace = true }
moa-core = { workspace = true }
moa-db = { workspace = true }
moa-hands = { workspace = true }
moa-lineage-citation = { workspace = true }
moa-lineage-core = { workspace = true }
moa-memory-graph = { workspace = true }
moa-memory-types = { workspace = true }
moa-memory-vector = { workspace = true }
moa-observability = { workspace = true }
moa-providers = { workspace = true }
moa-session = { workspace = true }
moa-security = { workspace = true }
moka.workspace = true
reqwest.workspace = true
rust-stemmers.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["tls-rustls", "chrono", "uuid", "json"] }
strum.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
workspace-hack = { workspace = true }

[dev-dependencies]
insta.workspace = true
moa-memory-ingest = { workspace = true, features = ["test-util"] }
moa-memory-pii = { workspace = true }
moa-providers = { workspace = true, features = ["test-util"] }
moa-session = { workspace = true }
proptest.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
wiremock.workspace = true

[[example]]
name = "chat_harness"
path = "examples/chat_harness.rs"
