[package]
name = "moa-skills"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
skill-learning = ["dep:moa-eval-core", "dep:moa-providers", "dep:moa-session"]
internal-eval-runner = ["skill-learning", "dep:moa-eval"]

[dependencies]
chrono.workspace = true
hex.workspace = true
moa-core = { workspace = true }
moa-eval-core = { workspace = true, optional = true }
moa-eval = { workspace = true, optional = true }
moa-memory-graph = { workspace = true }
moa-providers = { workspace = true, optional = true }
moa-session = { workspace = true, optional = true }
moka.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
sha2.workspace = true
sqlx = { workspace = true, features = ["tls-rustls", "chrono", "json", "uuid"] }
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
uuid.workspace = true
workspace-hack = { workspace = true }

[dev-dependencies]
async-trait.workspace = true
moa-eval-core.workspace = true
moa-providers.workspace = true
moa-session.workspace = true
moa-test-support = { workspace = true }
tempfile.workspace = true

[[test]]
name = "distillation"
path = "tests/distillation.rs"
required-features = ["internal-eval-runner"]

[[test]]
name = "improver"
path = "tests/improver.rs"
required-features = ["internal-eval-runner"]

[[test]]
name = "regression"
path = "tests/regression.rs"
required-features = ["internal-eval-runner"]
