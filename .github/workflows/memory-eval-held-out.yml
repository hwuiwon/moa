name: memory eval held-out acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  require-main:
    name: require main branch
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-main refs
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "memory eval held-out acceptance must run from refs/heads/main" >&2
            exit 1
          fi

  held-out-memory-eval:
    name: protected held-out memory acceptance
    needs: require-main
    runs-on: ubuntu-latest
    environment: memory-eval-held-out
    timeout-minutes: 60
    services:
      postgres:
        image: ghcr.io/hwuiwon/moa-postgres:pg17-pgvector0.8.2-pgaudit
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: moa
          POSTGRES_PASSWORD: ci
        options: >-
          --health-cmd "pg_isready -U postgres -d moa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MOA_DATABASE_URL: postgres://postgres:ci@localhost:5432/moa
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Generate reserved marked corpus
        run: >-
          cargo run -p xtask --release -- generate-memory-eval-corpus
          --profile pr
          --held-out
          --output target/memory-eval/pr-held-out

      - name: Run hermetic held-out retrieval eval
        run: >-
          env -u COHERE_API_KEY -u MOA_COHERE_API_KEY
          cargo run -p xtask --release -- run-memory-retrieval-eval
          --corpus target/memory-eval/pr-held-out
          --lane pr
          --extractor heuristic
          --reranker off
          --output target/memory-eval/held-out.json

      - name: Write paired held-out comparison
        run: >-
          cargo run -p xtask --release -- compare-eval-reports
          --baseline docs/eval/baselines/memory-retrieval-pr-held-out-baseline.json
          --candidate target/memory-eval/held-out.json
          --output target/memory-eval/held-out-compare.json

      - name: Enforce hard blockers and five-percent regression ceiling
        env:
          MOA_EVAL_PREVIOUS_MEMORY_REPORT: docs/eval/baselines/memory-retrieval-pr-held-out-baseline.json
        run: >-
          cargo run -p xtask --release -- check-eval-budgets
          --suite memory_retrieval
          --memory-eval-report target/memory-eval/held-out.json
          --max-regression-pct 5

      - name: Upload held-out acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-eval-held-out-${{ github.run_id }}
          retention-days: 30
          path: |
            target/memory-eval/pr-held-out/
            target/memory-eval/held-out.json
            target/memory-eval/held-out-compare.json
          if-no-files-found: error
