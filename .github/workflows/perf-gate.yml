name: perf-gate

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  retrieval-gate:
    runs-on: ubuntu-latest-8-core
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    services:
      postgres:
        image: pgvector/pgvector:pg17
        ports:
          - "5432:5432"
        env:
          POSTGRES_PASSWORD: ci
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run perf gate
        run: cargo run -p moa-loadtest --release --bin perf_gate -- --profile retrieval --duration 5m
        env:
          MOA_DATABASE_URL: postgres://postgres:ci@localhost/postgres
          MOA_COHERE_API_KEY: ${{ secrets.COHERE_API_KEY_CI }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-gate-retrieval-snapshot
          path: target/perf-gate/snapshot.prom

  loadtest-mock-smoke:
    runs-on: ubuntu-latest-8-core
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run remote mock loadtest gate
        run: make loadtest-mock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-gate-loadtest-mock-snapshot
          path: target/perf-gate/mock-short.prom
