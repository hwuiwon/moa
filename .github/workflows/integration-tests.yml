name: integration tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restate-fixture-smoke:
    runs-on: ubuntu-latest
    # The dedicated scripted fixture builds moa-orchestrator-bin inside the
    # test, which the old always-bailing invocation never paid for.
    timeout-minutes: 45
    env:
      MOA_PROVIDERS_OVERRIDE: scripted:/loadtest-scripts/perf-gate.json
      # Compose publishes restate ingress/admin at 10010/10011 and postgres at
      # 10040 (docker-compose.yml); these previously pointed at 18080/9070/25432,
      # which nothing publishes, so the smoke could only ever fail with
      # connection-refused.
      MOA_RESTATE_INGRESS_URL: http://localhost:10010
      MOA_RESTATE_ADMIN_URL: http://localhost:10011
      MOA_DATABASE_URL: postgres://moa_owner:dev@localhost:10040/moa
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Single-package `cargo run -p` builds unify features differently than
      # the workspace test build; a separate target dir stops them from
      # invalidating each other's fingerprints.
      - name: Check architecture boundaries
        run: CARGO_TARGET_DIR=target/tools cargo run -p xtask --locked -- check-architecture-boundaries

      - name: Start Postgres and OpenFGA
        run: docker compose up -d --build postgres openfga

      - name: Bootstrap OpenFGA
        run: |
          MOA_AUTHZ_OPENFGA_URL=http://localhost:10030 \
          MOA_AUTHZ_OPENFGA_PRESHARED_KEY=localdev-preshared-key-do-not-use-in-prod \
          MOA_FGA_ENV_OUTPUT=.env.fga \
          CARGO_TARGET_DIR=target/tools \
          cargo run -q -p moa-fga-bootstrap

      - name: Start Restate-backed orchestrator stack
        run: |
          set -a
          . ./.env.fga
          set +a
          docker compose up -d --build restate moa-orchestrator restate-register

      - name: Wait for Restate registration
        run: |
          for i in $(seq 1 60); do
            if docker compose logs restate-register 2>&1 | grep -q "registration complete"; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs restate-register
          exit 1

      # The two smoke tests need opposite environments, mirroring the
      # clean-e2e ladder's restate-service-e2e vs fixture-service-e2e split:
      # the session round trip targets the compose stack through the external
      # orchestrator env, while the scripted execution-run fixture boots its
      # own dedicated stack and refuses an external orchestrator by design.
      - name: Run fixture smoke (compose-backed session round trip)
        run: >-
          cargo test -p moa-test-support --features integration
          --test orchestrator_fixture_service_e2e
          fixture_round_trips_session_turn_through_restate
          -- --nocapture
      # The dedicated fixture boots its own Postgres/Restate/OpenFGA
      # testcontainers and spawns its own orchestrator; running it beside the
      # full compose stack starved the two-core runner badly enough that the
      # route classifier's bounded call timed out and the router took its
      # deliberate conservative Inline fallback, turning the expected Accepted
      # outcome into Completed. Free the compose stack's cores first.
      - name: Stop compose stack before the dedicated fixture
        run: docker compose down -v
      - name: Run fixture smoke (dedicated scripted fixture)
        run: >-
          env -u MOA_RESTATE_INGRESS_URL -u MOA_RESTATE_ADMIN_URL
          cargo test -p moa-test-support --features integration
          --test orchestrator_fixture_service_e2e
          fixture_round_trips_accepted_execution_run_through_restate
          -- --nocapture

      - name: Dump compose logs
        if: failure()
        run: docker compose logs postgres openfga restate moa-orchestrator restate-register

      - name: Stop compose stack
        if: always()
        run: docker compose down -v
