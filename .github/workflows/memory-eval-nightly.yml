# Nightly live memory eval bills Cohere. Worst-case monthly ceiling is roughly
# 30 * (5 + 5 + 15) = 750 USD before provider-side free tiers or aborts.
name: memory eval nightly live

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-memory-eval:
    name: live memory retrieval deltas
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ghcr.io/hwuiwon/moa-postgres-age:17.6-age1.7.0
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: moa
          POSTGRES_PASSWORD: ci
        options: >-
          --health-cmd "pg_isready -U postgres -d moa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      MOA_DATABASE_URL: postgres://postgres:ci@localhost:5432/moa
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Probe test database
        run: cargo run -p xtask --release -- migrate-test-db

      - name: Generate PR natural corpus
        run: cargo run -p xtask --release -- generate-memory-eval-corpus --profile pr --transcript-style natural --seed 1 --seed 2 --seed 3 --output target/memory-eval/pr-natural

      - name: Run hermetic PR natural replay
        run: env -u COHERE_API_KEY cargo run -p xtask --release -- run-memory-retrieval-eval --corpus target/memory-eval/pr-natural --lane pr --extractor recorded --output target/memory-eval/hermetic.json

      - name: Run live PR natural without reranker
        run: cargo run -p xtask --release -- run-memory-retrieval-eval --corpus target/memory-eval/pr-natural --lane live --reranker off --budget-usd 5 --output target/memory-eval/live.json

      - name: Check live PR natural hard blockers
        run: cargo run -p xtask --release -- check-eval-budgets --suite memory_retrieval --memory-eval-report target/memory-eval/live.json

      - name: Run live PR natural with reranker
        run: cargo run -p xtask --release -- run-memory-retrieval-eval --corpus target/memory-eval/pr-natural --lane live --reranker on --budget-usd 5 --output target/memory-eval/live-rerank.json

      - name: Check live rerank hard blockers
        run: cargo run -p xtask --release -- check-eval-budgets --suite memory_retrieval --memory-eval-report target/memory-eval/live-rerank.json

      - name: Compare hermetic and live
        run: cargo run -p xtask --release -- compare-eval-reports --baseline target/memory-eval/hermetic.json --candidate target/memory-eval/live.json > target/memory-eval/hermetic-vs-live-delta.txt

      - name: Compare live reranker A/B
        run: cargo run -p xtask --release -- compare-eval-reports --baseline target/memory-eval/live.json --candidate target/memory-eval/live-rerank.json > target/memory-eval/rerank-delta.txt

      - name: Generate full natural corpus
        run: cargo run -p xtask --release -- generate-memory-eval-corpus --profile full --transcript-style natural --seed 1 --seed 2 --seed 3 --output target/memory-eval/full-natural

      - name: Run full live natural scale check
        run: cargo run -p xtask --release -- run-memory-retrieval-eval --corpus target/memory-eval/full-natural --lane live --reranker on --budget-usd 15 --output target/memory-eval/full-live.json

      - name: Check full live hard blockers
        run: cargo run -p xtask --release -- check-eval-budgets --suite memory_retrieval --memory-eval-report target/memory-eval/full-live.json

      - name: Upload live memory eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-eval-live-${{ github.run_id }}
          retention-days: 30
          path: |
            target/memory-eval/hermetic.json
            target/memory-eval/live.json
            target/memory-eval/live-rerank.json
            target/memory-eval/full-live.json
            target/memory-eval/hermetic-vs-live-delta.txt
            target/memory-eval/rerank-delta.txt
          if-no-files-found: ignore
