name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Verify central migration history and ownership
        run: CARGO_TARGET_DIR=target/tools cargo run -p xtask --locked -- check-migrations

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # The repo's no-infra PR lane: no Postgres, Docker, Restate, OpenFGA,
      # PII sidecar, or live/billed providers (see .config/nextest.toml).
      - name: Run offline tests (fast-pr lane)
        run: cargo nextest run --locked --profile fast-pr

      # Compile the feature-gated eval command surface and execute its
      # deterministic null/oracle, corpus-authoring, and leakage gates. Database
      # controls remain owned by the db-tests job below; this step is unbilled.
      - name: Validate deterministic eval suite controls
        run: cargo run -p xtask --locked --features eval-tools -- eval-suite-controls

  # Manifest and observability contracts.
  #
  # Nothing in the Rust build reads a Kubernetes manifest, an Alloy config, or an
  # alert rule, so without this job those files are checked by no automated
  # process at all - and a broken alert expression or a typo'd manifest field is
  # only discovered by an alert that never fires.
  #
  # Every tool is installed at a pinned version AND verified by checksum. A
  # validator installed from a moving `latest` can disagree with itself between
  # runs, and a green result would then say nothing about the tree.
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KUBECONFORM_VERSION: v0.7.0
      KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
      ALLOY_VERSION: v1.18.0
      ALLOY_SHA256: 92f4c950aec4ec16a7fdbf6f805be4334d4d5fbbe458eecf514319c1c491bef4
      PROMETHEUS_VERSION: 3.13.1
      PROMETHEUS_SHA256: 962b812371aff838d152b6ff2d56fdb7a6396f5542f48ebf73421b9721f0d103
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pinned manifest and observability tools
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/tools" && cd "${RUNNER_TEMP}/tools"

          curl -sSL --fail -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform

          curl -sSL --fail -o alloy.zip \
            "https://github.com/grafana/alloy/releases/download/${ALLOY_VERSION}/alloy-linux-amd64.zip"
          echo "${ALLOY_SHA256}  alloy.zip" | sha256sum -c -
          unzip -oq alloy.zip && mv alloy-linux-amd64 alloy && chmod +x alloy

          curl -sSL --fail -o prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          echo "${PROMETHEUS_SHA256}  prometheus.tar.gz" | sha256sum -c -
          tar xzf prometheus.tar.gz "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          mv "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" promtool

          echo "${RUNNER_TEMP}/tools" >>"${GITHUB_PATH}"

      - name: Install PyYAML
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      # Renders every overlay and validates it against real schemas, including the
      # vendored Restate and PrometheusRule CRDs, with no missing-schema ignore.
      - name: Validate rendered manifests
        run: ./k8s/scripts/smoke.sh --validate-manifests

      # Alloy config, alert rules, and the metric names linking them to the Rust
      # source - the cross-language links no compiler checks.
      - name: Validate observability contracts
        run: ./k8s/scripts/validate-observability.sh

      # The vendored schemas must be reproducible from the pinned upstream CRDs.
      # A hand-edited schema would quietly widen what validation accepts.
      - name: Verify vendored CRD schemas are reproducible
        run: |
          set -euo pipefail
          ./k8s/schemas/refresh.sh
          git diff --exit-code -- k8s/schemas \
            || { echo "Vendored CRD schemas differ from the pinned upstream. Run k8s/schemas/refresh.sh and commit the result." >&2; exit 1; }

  # Canonical eval-fixture contracts.
  #
  # CI validates the committed input without running the live, billed sweep.
  #
  # This runs the parser/schema/hash validator only. It dispatches no sessions,
  # needs no credentials, and spends nothing.
  eval-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Schema, contiguous S001..S100, exact count of 100, embedded content
      # hash, and the sha256 sidecar over the fixture bytes. Editing the
      # fixture without refreshing both hashes fails this step.
      - name: Validate 100-session sweep case fixture
        run: python3 .agents/skills/moa-100-session-sweep/scripts/run_100_session_sweep.py --validate-cases

      # Negative coverage for the validator itself: duplicate/missing/reordered
      # ids, malformed required fields, wrong counts, and stale hashes.
      - name: Run sweep fixture validator tests
        run: python3 -m unittest discover -s .agents/skills/moa-100-session-sweep/tests -v

  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      MOA_DATABASE_URL: postgres://moa_owner:dev@localhost:10040/moa
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Start Postgres
        run: docker compose up -d --build postgres

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T postgres pg_isready -U moa_owner -d moa >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "timed out waiting for compose Postgres" >&2
          docker compose logs postgres
          exit 1

      # Postgres-only lanes (see docs/20-testing.md): schema-isolated DB tests
      # and template-cloned graph/vector state tests.
      - name: Run DB session tests
        run: cargo nextest run --locked --profile db-session

      - name: Run DB memory tests
        run: cargo nextest run --locked --profile db-memory

      - name: Dump Postgres logs
        if: failure()
        run: docker compose logs postgres

      - name: Stop compose stack
        if: always()
        run: docker compose down -v
