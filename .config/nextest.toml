[profile.default]
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 4 }

[profile.ci]
inherits = "default"
fail-fast = false
junit.path = "target/nextest/ci/junit.xml"
# The cross-tenant pentest has its own explicit CI step because it writes a
# security report and intentionally mutates shared graph/vector state.
default-filter = '''
all()
  - binary(/^cross_tenant_pentest_db_memory$/)
'''

[profile.fast-pr]
inherits = "default"
# The default developer/PR smoke lane: no Postgres, Docker, Restate, OpenFGA,
# PII sidecar, cloud auth, recorded eval, or live/billed providers.
default-filter = '''
all()
  - binary(/(_db|_db_memory|_service_e2e|_provider_e2e|_live|_docker)$/)
  - test(/_db_memory$/)
  - binary(/^(golden_eval|long_conversation_foundation_eval|long_conversation_smoke_eval|scripted_user_mode_eval)$/)
  - (package(moa-eval) & kind(lib) & test(/::tests::.*_db(?:_|$)/))
  - (package(moa-orchestrator) & kind(lib) & test(/::tests::.*_db(?:_|$)/))
'''

# test() predicates below are scoped to the binaries that actually contain
# inline DB-named unit tests. An unscoped test() forces nextest to exec-list
# every workspace test binary (255 binaries, minutes of overhead per run);
# binary()/package()/kind() scoping lets it skip unmatched binaries without
# exec. If a new binary gains inline `*_db`/`*_db_*` tests, add it here;
# the ci profile's all() filter remains the safety net.
[profile.db-session]
inherits = "default"
test-threads = 8
# moa-session keeps its physical-database clone and schema-binding checks inline
# in the library. Select only those DB tests; all other moa-session lib tests
# remain outside this lane.
default-filter = '''
binary(/_db$/)
  | (
      package(moa-session)
        & kind(lib)
        & test(/^(store::tests::configured_schema_binds_without_running_migrations_db|testing::tests::cloned_databases_are_independent_and_use_public_schema_db)$/)
    )
  | (package(moa-eval) & kind(lib) & test(/::tests::.*_db(?:_|$)/))
  | (package(moa-orchestrator) & kind(lib) & test(/::tests::.*_db(?:_|$)/))
'''

[profile.db-memory]
inherits = "default"
test-threads = 4
default-filter = '''
(
  binary(/_db_memory$/)
    | (package(moa-eval) & kind(lib) & test(/_db_memory$/))
    | (package(moa-orchestrator) & binary(knowledge_service) & test(/_db_memory$/))
)
  - binary(/^cross_tenant_pentest_db_memory$/)
'''

[profile.authz-pentest]
inherits = "default"
test-threads = 1
default-filter = 'binary(/^cross_tenant_pentest_db_memory$/)'

[profile.restate-service-e2e]
inherits = "default"
test-threads = 1
junit.path = "junit.xml"
default-filter = '''
binary(/^(agent_artifacts_service_e2e|consolidate_service_e2e|session_store_service_e2e|tenant_purge_service_e2e|tool_executor_service_e2e)$/)
  - test(/recovery_matrix_/)
'''

[profile.orchestrator-service-e2e]
inherits = "default"
test-threads = 1
default-filter = '''
binary(/^(session_turn_lifecycle_service_e2e|turn_execution_smoke_service_e2e)$/)
  - test(/recovery_matrix_/)
'''

[profile.service-e2e]
inherits = "default"
test-threads = 1
default-filter = 'binary(/_service_e2e$/)'

[profile.fixture-service-e2e]
inherits = "default"
test-threads = 1
default-filter = '''
binary(/^orchestrator_fixture_service_e2e$/)
  | binary(/^(action_policy_service_e2e|guardrails_service_e2e|ingestion_service_e2e|memory_service_e2e|turn_responsiveness_service_e2e)$/)
  | binary(/^turn_terminal_failure_service_e2e$/)
'''

# Accelerated eight-logical-day execution validation. The binary owns one
# disposable Restate/Postgres/Valkey fixture and deliberately restarts those
# dependencies, so cases are serialized and have a hard ten-minute ceiling.
[profile.long-horizon-execution]
inherits = "default"
test-threads = 1
junit.path = "target/nextest/long-horizon-execution/junit.xml"
default-filter = 'package(moa-orchestrator) & binary(/^long_horizon_execution_service_e2e$/)'
slow-timeout = { period = "60s", terminate-after = 10 }

# The thousand-common-wake case deliberately spends its first three minutes
# admitting and parking 1,000 runs before one shared absolute wake, then drains
# them in ~32 fleet-capped waves. That budget exceeds the lane's own ten-minute
# ceiling, so nextest was terminating the single gate that proves fleet cap and
# WFQ fairness instead of letting it fail on one of its own bounded phases.
# Every phase inside the case is bounded well below this ceiling, so a real
# regression still reports which phase stalled.
[[profile.long-horizon-execution.overrides]]
filter = '''
binary(/^long_horizon_execution_service_e2e$/)
  & test(/one_thousand_common_wakes_bound_capacity_invocations_and_oldest_ready_age/)
'''
slow-timeout = { period = "120s", terminate-after = 10 }

# Small deterministic crash/replay and worker-deadline cases run serially on
# pull requests. Large fan-out, A/B rollout, node-loss, and chaos scenarios
# remain in their existing local/nightly lanes.
[profile.restate-recovery-pr]
inherits = "default"
test-threads = 1
junit.path = "junit.xml"
default-filter = '''
package(moa-orchestrator)
  & (
      (binary(/^recovery_matrix_sandbox_workspace_service_e2e$/)
        & test(/recovery_matrix_sandbox_workspace_/))
      | binary(/^worker_coordination_service_e2e$/)
      | (test(/recovery_matrix_/) - binary(/^sandbox_workspace_soak_service_e2e$/))
    )
'''
slow-timeout = { period = "120s", terminate-after = 5 }

# Scheduled-only 1,000-tenant workspace capacity and inventory convergence. It
# is deliberately disjoint from the PR recovery profile: the test is ignored,
# serial, and makes enough database writes to model fleet headroom rather than
# a merge-time smoke.
[profile.sandbox-workspace-soak]
inherits = "default"
test-threads = 1
junit.path = "target/nextest/sandbox-workspace-soak/junit.xml"
default-filter = '''
package(moa-orchestrator)
  & binary(/^sandbox_workspace_soak_service_e2e$/)
  & test(/^sandbox_workspace_1000_tenant_soak/)
'''
slow-timeout = { period = "120s", terminate-after = 15 }

# --- Behavior Lab lanes -------------------------------------------------------
#
# The Behavior Lab is the contained candidate-evaluation surface: an
# ExperimentRun / ExperimentTrialRun executes a release candidate against a
# scripted environment and produces the scorecard that release gating consumes.
# Its binaries existed but matched no lane that `scripts/run-clean-e2e.sh`
# invoked, so nothing scheduled them and they decayed silently. These profiles
# are the wiring; renaming the binaries would not have scheduled them.
#
# The surface splits by how each binary obtains its Restate stack, and that
# split is a hard constraint rather than a preference:
#
#   * `behavior-lab-service-e2e` binaries resolve the stack from
#     `MOA_RESTATE_INGRESS_URL`/`MOA_RESTATE_ADMIN_URL` and spawn their own
#     `moa-orchestrator-bin` on reserved ports. They must run with those
#     variables SET (the ephemeral server `run-clean-e2e.sh` starts).
#   * `behavior-lab-fixture-service-e2e` uses
#     `OrchestratorTestFixture::with_execution_fixture`, which hard-fails with
#     "dedicated execution fixtures cannot use an external orchestrator" when
#     `MOA_RESTATE_INGRESS_URL` is set. It must run with those variables UNSET,
#     like the `fixture-service-e2e` lane.
#
# Both lanes are `test-threads = 1`: every one of these tests takes the
# process-wide `RESTATE_E2E_LOCK` or owns a dedicated fixture, and they share
# one Postgres database, one OpenFGA store, and one Valkey instance.
#
# `skill_learning_gate_e2e` needs Postgres and `provider-overrides` but no
# Restate. It is grouped here rather than in a lane of its own because it
# evaluates a release candidate through the real eval engine before the skill
# can be accepted, which is the same gating surface; the lane's runtime
# requirements are a strict superset of its own.
[profile.behavior-lab-service-e2e]
inherits = "default"
test-threads = 1
# The billed trial-to-score smoke is excluded here and selected only by
# `behavior-lab-live`. Without this subtraction, `--run-ignored ignored-only`
# would spend provider credit inside the deterministic lane whenever a run also
# enabled the provider flags.
default-filter = '''
binary(/^(experiment_trial_run_e2e|skill_learning_gate_e2e)$/)
  - (binary(/^experiment_trial_run_e2e$/) & test(/^experiment_plan_to_trial_to_score_live$/))
'''

[profile.behavior-lab-fixture-service-e2e]
inherits = "default"
test-threads = 1
default-filter = 'binary(/^artifact_release_service_e2e$/)'

# Billed. Selected only by `scripts/run-clean-e2e.sh --behavior-lab-live`, which
# demands MOA_RUN_LIVE_E2E=1, MOA_RUN_LIVE_PROVIDER_TESTS=1, and a positive
# MOA_BEHAVIOR_LAB_BUDGET_USD before it will schedule anything. The test itself
# stays `#[ignore]`d and re-checks its own authorization flags.
[profile.behavior-lab-live]
inherits = "default"
test-threads = 1
default-filter = 'binary(/^experiment_trial_run_e2e$/) & test(/^experiment_plan_to_trial_to_score_live$/)'

[profile.loadtest-service-e2e]
inherits = "default"
test-threads = 1
default-filter = '''
binary(/^mock_loadtest_service_e2e$/)
'''

[profile.provider-e2e]
inherits = "default"
test-threads = 1
# The coordinator provider binary also contains deterministic crash/recovery
# fixtures. Those fixtures own a dedicated Restate instance and run in the
# restate-recovery lane, so they cannot share the external Restate configured
# for provider E2E. The paid 20x5 execution evaluation has a separate budget
# authorization contract and must never be swept into the ordinary provider
# lane merely because its binary name ends in `_provider_e2e`.
default-filter = '''
(
  binary(/_provider_e2e$/)
    | binary(/^(provider_matrix_live|query_rewrite_live)$/)
)
  - (binary(/^coordinator_worker_behavior_provider_e2e$/) & test(/^recovery_matrix_/))
  - binary(/^execution_eval_provider_e2e$/)
'''

[profile.eval-recorded]
inherits = "default"
test-threads = 2
default-filter = 'binary(/^(golden_eval|long_conversation_foundation_eval|long_conversation_smoke_eval|scripted_user_mode_eval)$/)'

[profile.execution-eval-pr]
inherits = "default"
test-threads = 1
junit.path = "target/nextest/execution-eval-pr/junit.xml"
# Bounded merge-gating coverage: representative routing, completion, replan,
# generation-fence, and adversarial honesty scenarios. Budget/deadline admission
# is pinned in the database lane, where exact pre-dispatch state is controllable. The
# 500-item silent-incompleteness case remains in the complete nightly lane.
default-filter = '''
binary(/^execution_run_service_e2e$/)
  & (
      test(/respond_simple_question_uses_no_tools_planner_or_run_service_e2e/)
      | test(/execute_inline_runs_bounded_tool_loop_without_durable_run_service_e2e/)
      | test(/execute_inline_uses_instruction_only_skill_without_durable_run_service_e2e/)
      | test(/execute_inline_upgrades_once_to_durable_with_preserved_evidence_service_e2e/)
      | test(/no_skill_research_compiles_executes_streams_and_synthesizes_service_e2e/)
      | test(/completion_gate_missing_company_service_e2e/)
      | test(/duplicate_plan_stops_replan_service_e2e/)
      | test(/duplicate_amendment_stops_replan_service_e2e/)
      | test(/repeated_failure_stops_replan_service_e2e/)
      | test(/remove_only_amendment_is_no_progress_service_e2e/)
      | test(/useful_amendment_preserves_completed_work_service_e2e/)
      | test(/stale_generation_is_audit_only_service_e2e/)
      | test(/duplicate_completion_does_not_double_account_service_e2e/)
      | (test(/execution_eval_/) - test(/execution_eval_silent_incomplete_500_item_universe/))
    )
'''

[profile.execution-eval-nightly]
inherits = "default"
test-threads = 1
junit.path = "target/nextest/execution-eval-nightly/junit.xml"
default-filter = 'binary(/^execution_run_service_e2e$/)'

# The ClickHouse analytics arm. It is a supported-but-undeployed backend: fully
# wired from `[clickhouse]` config presence, exercised in the db lanes against a
# mock server, but its cross-backend parity and real-server schema contracts can
# only be checked against an actual ClickHouse. Those tests are `#[ignore]`d and
# match no other lane's filter, so without this profile nothing schedules them
# and they decay silently against schema changes made elsewhere. Run via
# `make test-clickhouse`; triggered in CI by the `clickhouse-analytics` job in
# .github/workflows/integration-tests.yml.
#
# `analytics_export_load_db` is deliberately NOT here. It is orphaned by the same
# mechanism and belongs in this lane, but it is already red independently of this
# profile: its mock answers every request with a DDL handler, which the bootstrap's
# `system.databases` lookup cannot decode. Adding it would land this job red.
# Reworking that mock needs an owner for `tests/analytics_export_load_db.rs`.
[profile.clickhouse-docker]
inherits = "default"
test-threads = 1
junit.path = "target/nextest/clickhouse-docker/junit.xml"
default-filter = '''
binary(/^(schema_drift_docker|clickhouse_docker|analytics_parity_docker|analytics_clickhouse_e2e)$/)
  | (package(moa-analytics-export) & kind(lib) & test(/_docker$/))
'''

[test-groups]
db-session = { max-threads = 4 }
# db-memory tests use per-test databases cloned from the migration template
# and per-test session-store pools capped at 10 connections, so moderate
# parallelism is safe against the compose Postgres (max_connections = 100).
db-memory = { max-threads = 4 }
brain-turn-db = { max-threads = 1 }
# `claim_expired` is a fleet-wide sweep by design: one call claims every expired
# hand lease in the database, not only the rows the calling test seeded. Two of
# these tests running at once steal each other's seeded leases, so this binary
# takes the shared database one test at a time.
hand-leases-db = { max-threads = 1 }
eval-recorded = { max-threads = 1 }
service-e2e = { max-threads = 1 }
live-external = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(/^(brain_turn_artifacts_db|brain_turn_session_search_db)$/)'
test-group = "brain-turn-db"
threads-required = 1

[[profile.default.overrides]]
filter = 'binary(hands_db)'
test-group = "hand-leases-db"
threads-required = 1

[[profile.default.overrides]]
filter = 'binary(/_db$/)'
test-group = "db-session"
threads-required = 1

[[profile.default.overrides]]
filter = 'binary(/_db_memory$/) | test(/_db_memory$/)'
test-group = "db-memory"
threads-required = 1

[[profile.default.overrides]]
filter = 'binary(/^(golden_eval|long_conversation_foundation_eval|long_conversation_smoke_eval|scripted_user_mode_eval)$/)'
test-group = "eval-recorded"
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = 'binary(/_service_e2e$/)'
test-group = "service-e2e"
threads-required = "num-test-threads"

[[profile.default.overrides]]
# Behavior Lab binaries that do not carry the `_service_e2e` suffix still drive a
# shared Restate server, Postgres database, and OpenFGA store, so they take the
# same exclusive slot as the rest of the service lane.
filter = 'binary(/^(experiment_trial_run_e2e|skill_learning_gate_e2e)$/)'
test-group = "service-e2e"
threads-required = "num-test-threads"

[[profile.default.overrides]]
# A Behavior Lab case boots an orchestrator process, registers a deployment, and
# then polls a durable ExperimentRun/ExperimentTrialRun to completion; the
# in-test waits alone budget 90s twice over. The default 60s/4 ceiling lands
# right on that worst case, so give the lane a wider leash before nextest
# terminates a run that is merely slow.
filter = '''
binary(/^(artifact_release_service_e2e|experiment_trial_run_e2e)$/)
'''
slow-timeout = { period = "120s", terminate-after = 6 }

[[profile.default.overrides]]
# The explicit 500-task fan-out and restart scenarios intentionally hold every
# map effect before releasing a thundering herd through the debug orchestrator.
filter = 'test(/bulk_500_map_exact_coverage_service_e2e|recovery_after_materialization_is_exactly_once_service_e2e|recovery_after_137_completions_is_exactly_once_service_e2e/)'
slow-timeout = { period = "120s", terminate-after = 10 }

[[profile.default.overrides]]
# Chaos experiments recreate containers and run multi-minute steady/fault/
# recovery windows; give them a long leash before nextest terminates them.
filter = 'binary(/^chaos_docker$/)'
slow-timeout = { period = "120s", terminate-after = 8 }

[[profile.default.overrides]]
filter = 'binary(/(_provider_e2e|_live|_docker)$/)'
test-group = "live-external"
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = 'package(moa-orchestrator) & kind(lib) & test(/::tests::.*_db(?:_|$)/)'
test-group = "db-session"
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = 'package(moa-eval) & kind(lib) & test(/::tests::.*_db(?:_|$)/)'
test-group = "db-session"
threads-required = "num-test-threads"
