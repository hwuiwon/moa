api_version: moa.artifact/v1
kind: skill
metadata:
  name: human-approval
  description: Skill whose execution plan pauses for an explicit human review.
  tags:
    - pattern
    - human-in-the-loop
status: draft
definition:
  type: skill
  spec:
    instructions:
      path: SKILL.md
    execution_plan:
      goal:
        requirements:
          - id: req_approval
            description: Execute the action only after explicit human approval.
        deliverables: []
        coverage: []
        constraints: []
        completion_checks:
          - id: check_output
            description: Validate the approved action output.
            requirement_ids: [req_approval]
            constraint_ids: []
            kind:
              kind: output_schema
      plan:
        schema_version: 1
        input_schema:
          type: object
        output_schema:
          type: object
        nodes:
          - id: draft_action
            requirement_ids: [req_approval]
            depends_on: []
            input: {}
            output_schema:
              type: object
            operation:
              kind: capability
              reference:
                name: action://refund_policy.draft_refund
                version: v1
            retry:
              max_attempts: 1
              initial_backoff_ms: 0
              max_backoff_ms: 0
          - id: approval
            requirement_ids: [req_approval]
            depends_on: [draft_action]
            input:
              draft:
                $ref: $.nodes.draft_action.output
            output_schema:
              type: object
            operation:
              kind: review
              prompt: Approve or reject the drafted customer-visible action.
            retry:
              max_attempts: 1
              initial_backoff_ms: 0
              max_backoff_ms: 0
          - id: execute_action
            requirement_ids: [req_approval]
            depends_on: [approval]
            input:
              decision:
                $ref: $.nodes.approval.output
            output_schema:
              type: object
            operation:
              kind: capability
              reference:
                name: action://orders.refund
                version: v1
            retry:
              max_attempts: 1
              initial_backoff_ms: 0
              max_backoff_ms: 0
          - id: output
            requirement_ids: [req_approval]
            depends_on: [execute_action]
            input: {}
            output_schema:
              type: object
            operation:
              kind: output
              value:
                $ref: $.nodes.execute_action.output
            retry:
              max_attempts: 1
              initial_backoff_ms: 0
              max_backoff_ms: 0
