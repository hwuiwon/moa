api_version: moa.artifact/v1
kind: workflow
metadata:
  name: human-approval
  description: Deterministic skill that pauses on an explicit human approval node.
  tags:
    - pattern
    - human-in-the-loop
status: draft
definition:
  type: workflow
  spec:
    nodes:
      - id: start
        kind: start
        ui:
          x: 80
          y: 150
      - id: draft_action
        kind: skill_action
        ref: action://refund_policy.draft_refund
        input:
          operation: draft_refund
        ui:
          x: 280
          y: 150
      - id: approval
        kind: review
        input:
          prompt: Approve or reject the drafted customer-visible action.
        ui:
          x: 500
          y: 150
      - id: execute_action
        kind: action
        ref: action://orders.refund
        input:
          source: approved_workflow
        ui:
          x: 720
          y: 150
      - id: done
        kind: end
        input:
          status: approved
        ui:
          x: 920
          y: 150
    edges:
      - id: start-draft-action
        from: start
        to: draft_action
      - id: draft-action-approval
        from: draft_action
        to: approval
      - id: approval-execute-action
        from: approval
        to: execute_action
      - id: execute-action-done
        from: execute_action
        to: done
    ui:
      layout: dagre
      version: 1
