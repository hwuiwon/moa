api_version: moa.artifact/v1
kind: skill
metadata:
  name: sequential-support-check
  description: Skill whose execution plan runs support checks in a fixed order.
  tags:
    - pattern
    - sequential
status: draft
definition:
  type: skill
  spec:
    instructions:
      path: SKILL.md
    inputs:
      type: object
      properties:
        order_id:
          type: string
    execution_plan:
      goal:
        requirements:
          - id: req_support_check
            description: Complete the support check in dependency order.
        deliverables: []
        coverage: []
        constraints: []
        completion_checks:
          - id: check_output
            description: Validate the persisted support summary output.
            requirement_ids: [req_support_check]
            constraint_ids: []
            kind:
              kind: output_schema
      plan:
        schema_version: 2
        cancel_policy: retain_effects
        input_schema:
          type: object
          properties:
            order_id:
              type: string
        output_schema:
          type: object
        nodes:
          - id: lookup_order
            requirement_ids: [req_support_check]
            depends_on: []
            input:
              order_id:
                $ref: $.input.order_id
            output_schema:
              type: object
            operation:
              kind: capability
              reference:
                name: orders.lookup
                version: v1
            compensation: null
            retry:
              max_attempts: 2
              initial_backoff_ms: 100
              max_backoff_ms: 1000
          - id: check_policy
            requirement_ids: [req_support_check]
            depends_on: [lookup_order]
            input:
              order:
                $ref: $.nodes.lookup_order.output
            output_schema:
              type: object
            operation:
              kind: capability
              reference:
                name: action://refund_policy.check
                version: v1
            compensation: null
            retry:
              max_attempts: 1
              initial_backoff_ms: 0
              max_backoff_ms: 0
          - id: write_summary
            requirement_ids: [req_support_check]
            depends_on: [check_policy]
            input:
              policy_result:
                $ref: $.nodes.check_policy.output
              source_name: sequential-support-check
            output_schema:
              type: object
            operation:
              kind: capability
              reference:
                name: memory.write
                version: v1
            compensation: null
            retry:
              max_attempts: 1
              initial_backoff_ms: 0
              max_backoff_ms: 0
          - id: output
            requirement_ids: [req_support_check]
            depends_on: [write_summary]
            input: {}
            output_schema:
              type: object
            operation:
              kind: output
              value:
                $ref: $.nodes.write_summary.output
            compensation: null
            retry:
              max_attempts: 1
              initial_backoff_ms: 0
              max_backoff_ms: 0
