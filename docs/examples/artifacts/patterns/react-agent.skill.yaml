api_version: moa.artifact/v1
kind: skill
metadata:
  name: react-agent
  description: Skill whose execution plan delegates one bounded open-ended task to an agent.
  tags:
    - pattern
    - react
    - agent
status: draft
definition:
  type: skill
  spec:
    instructions:
      path: SKILL.md
    execution_plan:
      goal:
        requirements:
          - id: req_recommendation
            description: Produce one recommendation grounded in retrieved context.
        deliverables: []
        coverage: []
        constraints: []
        completion_checks:
          - id: check_output
            description: Validate the recommendation output.
            requirement_ids: [req_recommendation]
            constraint_ids: []
            kind:
              kind: output_schema
      plan:
        cancel_policy: retain_effects
        input_schema:
          type: object
        output_schema:
          type: object
        nodes:
          - id: retrieve_context
            requirement_ids: [req_recommendation]
            depends_on: []
            input:
              query: customer preferences relevant to this task
              limit: 6
            output_schema:
              type: object
            operation:
              kind: capability
              reference:
                name: memory.read
                version: v1
            compensation: null
            retry:
              max_attempts: 2
              initial_backoff_ms: 100
              max_backoff_ms: 1000
          - id: bounded_agent_turn
            requirement_ids: [req_recommendation]
            depends_on: [retrieve_context]
            input:
              context:
                $ref: $.nodes.retrieve_context.output
            output_schema:
              type: object
            operation:
              kind: agent
              instructions: Use the retrieved context, reason with capabilities if needed, and return one final recommendation.
              skill_refs:
                - skill://support-triage
              capability_refs:
                - name: orders.lookup
                  version: v1
                - name: knowledge.search
                  version: v1
              max_turns: 4
            compensation: null
            retry:
              max_attempts: 1
              initial_backoff_ms: 0
              max_backoff_ms: 0
          - id: output
            requirement_ids: [req_recommendation]
            depends_on: [bounded_agent_turn]
            input: {}
            output_schema:
              type: object
            operation:
              kind: output
              value:
                $ref: $.nodes.bounded_agent_turn.output
            compensation: null
            retry:
              max_attempts: 1
              initial_backoff_ms: 0
              max_backoff_ms: 0
