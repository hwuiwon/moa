api_version: moa.artifact/v1
kind: skill
metadata:
  name: custom-logic-routing
  description: Skill whose execution plan uses explicit conditional routing and bounded retries.
  tags:
    - pattern
    - custom-logic
status: draft
definition:
  type: skill
  spec:
    instructions:
      path: SKILL.md
    inputs:
      type: object
      properties:
        priority:
          type: string
        retry:
          type: boolean
    execution_plan:
      goal:
        requirements:
          - id: req_route
            description: Route the case according to its declared priority.
        deliverables: []
        coverage: []
        constraints: []
        completion_checks:
          - id: check_output
            description: Validate the routed response output.
            requirement_ids: [req_route]
            constraint_ids: []
            kind:
              kind: output_schema
      plan:
        schema_version: 1
        input_schema:
          type: object
          properties:
            priority:
              type: string
            retry:
              type: boolean
        output_schema:
          type: object
        nodes:
          - id: escalate
            requirement_ids: [req_route]
            depends_on: []
            when:
              kind: equals
              reference:
                $ref: $.input.priority
              value: high
            input:
              retry_requested:
                $ref: $.input.retry
            output_schema:
              type: object
            operation:
              kind: agent
              instructions: Investigate the high-priority case and summarize blockers.
              skill_refs: []
              capability_refs:
                - name: orders.lookup
                  version: v1
                - name: knowledge.search
                  version: v1
              max_turns: 2
            retry:
              max_attempts: 2
              initial_backoff_ms: 100
              max_backoff_ms: 1000
          - id: standard_response
            requirement_ids: [req_route]
            depends_on: []
            when:
              kind: equals
              reference:
                $ref: $.input.priority
              value: standard
            input: {}
            output_schema:
              type: object
            operation:
              kind: agent
              instructions: Produce a concise standard response.
              skill_refs: []
              capability_refs: []
              max_turns: 1
            retry:
              max_attempts: 1
              initial_backoff_ms: 0
              max_backoff_ms: 0
          - id: output
            requirement_ids: [req_route]
            depends_on: [escalate, standard_response]
            input: {}
            output_schema:
              type: object
            operation:
              kind: output
              value:
                escalation:
                  $ref: $.nodes.escalate.output
                standard_response:
                  $ref: $.nodes.standard_response.output
            retry:
              max_attempts: 1
              initial_backoff_ms: 0
              max_backoff_ms: 0
