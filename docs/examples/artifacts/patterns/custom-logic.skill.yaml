api_version: moa.artifact/v1
kind: skill
metadata:
  name: custom-logic-routing
  description: Skill whose execution plan uses explicit conditional routing and bounded retries.
  tags:
    - pattern
    - custom-logic
status: draft
definition:
  type: skill
  spec:
    instructions:
      path: SKILL.md
    inputs:
      type: object
      required: [priority, retry]
      properties:
        priority:
          type: string
          enum: [high, standard]
        retry:
          type: boolean
    execution_plan:
      goal:
        requirements:
          - id: req_route
            description: Route the case according to its declared priority.
        deliverables: []
        coverage: []
        constraints: []
        completion_checks:
          - id: check_output
            description: Validate the routed response output.
            requirement_ids: [req_route]
            constraint_ids: []
            kind:
              kind: output_schema
      plan:
        cancel_policy: retain_effects
        input_wait_policy:
          expiry:
            kind: after
            delay_seconds: 86400
          on_expiry:
            kind: fail_task
        input_schema:
          type: object
          required: [priority, retry]
          properties:
            priority:
              type: string
              enum: [high, standard]
            retry:
              type: boolean
        output_schema:
          type: object
        nodes:
          # Explicit routing: each branch declares the exact value it runs for, so a run
          # takes one of them and the other is committed as `skipped`. The branches are
          # effectful leaves — the terminal output reports the route that was chosen, not
          # a branch's output, because a skipped branch produces none.
          - id: escalate
            requirement_ids: [req_route]
            depends_on: []
            when:
              kind: equals
              reference:
                $ref: $.input.priority
              value: high
            input:
              retry_requested:
                $ref: $.input.retry
            output_schema:
              type: object
            operation:
              kind: agent
              instructions: Investigate the high-priority case and summarize blockers.
              skill_refs: []
              capability_refs:
                - name: orders.lookup
                  version: v1
                - name: knowledge.search
                  version: v1
              max_turns: 2
            compensation: null
            retry:
              max_attempts: 2
              initial_backoff_ms: 100
              max_backoff_ms: 1000
          - id: standard_response
            requirement_ids: [req_route]
            depends_on: []
            when:
              kind: equals
              reference:
                $ref: $.input.priority
              value: standard
            input: {}
            output_schema:
              type: object
            operation:
              kind: agent
              instructions: Produce a concise standard response.
              skill_refs: []
              capability_refs: []
              max_turns: 1
            compensation: null
            retry:
              max_attempts: 1
              initial_backoff_ms: 0
              max_backoff_ms: 0
          - id: output
            requirement_ids: [req_route]
            depends_on: [escalate, standard_response]
            input: {}
            output_schema:
              type: object
            operation:
              kind: output
              value:
                routed_priority:
                  $ref: $.input.priority
            compensation: null
            retry:
              max_attempts: 1
              initial_backoff_ms: 0
              max_backoff_ms: 0
