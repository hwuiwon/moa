api_version: moa.artifact/v1
kind: skill
metadata:
  name: parallel-review
  description: Skill whose execution plan gathers evidence in parallel behind one review gate.
  tags:
    - pattern
    - parallel
    - review
status: draft
definition:
  type: skill
  spec:
    instructions:
      path: SKILL.md
    execution_plan:
      goal:
        requirements:
          - id: req_review
            description: Gather both evidence sources before manager review.
        deliverables: []
        coverage: []
        constraints: []
        completion_checks:
          - id: check_output
            description: Validate the reviewed refund output.
            requirement_ids: [req_review]
            constraint_ids: []
            kind:
              kind: output_schema
      plan:
        cancel_policy: retain_effects
        input_wait_policy:
          expiry:
            kind: after
            delay_seconds: 86400
          on_expiry:
            kind: fail_task
        input_schema:
          type: object
        output_schema:
          type: object
        nodes:
          - id: check_order
            requirement_ids: [req_review]
            depends_on: []
            input:
              include_line_items: true
            output_schema:
              type: object
            operation:
              kind: capability
              reference:
                name: orders.lookup
                version: v1
            compensation: null
            retry:
              max_attempts: 2
              initial_backoff_ms: 100
              max_backoff_ms: 1000
          - id: check_delivery
            requirement_ids: [req_review]
            depends_on: []
            input:
              include_gps: false
            output_schema:
              type: object
            operation:
              kind: capability
              reference:
                name: delivery.lookup
                version: v1
            compensation: null
            retry:
              max_attempts: 2
              initial_backoff_ms: 100
              max_backoff_ms: 1000
          - id: manager_review
            requirement_ids: [req_review]
            depends_on: [check_order, check_delivery]
            input:
              order:
                $ref: $.nodes.check_order.output
              delivery:
                $ref: $.nodes.check_delivery.output
            output_schema:
              type: object
            operation:
              kind: review
              prompt: Review gathered evidence before issuing a refund.
              wait_policy:
                expiry:
                  kind: after
                  delay_seconds: 86400
                on_expiry:
                  kind: fail_task
            compensation: null
            retry:
              max_attempts: 1
              initial_backoff_ms: 0
              max_backoff_ms: 0
          - id: issue_refund
            requirement_ids: [req_review]
            depends_on: [manager_review]
            input:
              decision:
                $ref: $.nodes.manager_review.output
            output_schema:
              type: object
            operation:
              kind: capability
              reference:
                name: action://orders.refund
                version: v1
            compensation: null
            retry:
              max_attempts: 1
              initial_backoff_ms: 0
              max_backoff_ms: 0
          - id: output
            requirement_ids: [req_review]
            depends_on: [issue_refund]
            input: {}
            output_schema:
              type: object
            operation:
              kind: output
              value:
                $ref: $.nodes.issue_refund.output
            compensation: null
            retry:
              max_attempts: 1
              initial_backoff_ms: 0
              max_backoff_ms: 0
