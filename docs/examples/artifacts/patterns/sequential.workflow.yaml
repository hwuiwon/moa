api_version: moa.artifact/v1
kind: workflow
metadata:
  name: sequential-support-check
  description: Deterministic skill that runs support checks in a fixed order.
  tags:
    - pattern
    - sequential
status: draft
definition:
  type: workflow
  spec:
    input_schema:
      type: object
      properties:
        order_id:
          type: string
    nodes:
      - id: start
        kind: start
        ui:
          x: 80
          y: 140
      - id: lookup_order
        kind: tool
        tool_refs:
          - tool://orders.lookup
        input:
          order_id_path: input.order_id
        ui:
          x: 260
          y: 140
      - id: check_policy
        kind: skill_action
        ref: action://refund_policy.check
        input:
          mode: deterministic_check
        ui:
          x: 460
          y: 140
      - id: write_summary
        kind: memory_write
        input:
          content: "Support workflow completed a sequential order check."
          source_name: sequential-support-check
        ui:
          x: 660
          y: 140
      - id: done
        kind: end
        input:
          status: checked
        ui:
          x: 860
          y: 140
    edges:
      - id: start-lookup-order
        from: start
        to: lookup_order
      - id: lookup-order-check-policy
        from: lookup_order
        to: check_policy
      - id: check-policy-write-summary
        from: check_policy
        to: write_summary
      - id: write-summary-done
        from: write_summary
        to: done
    ui:
      layout: dagre
      version: 1
