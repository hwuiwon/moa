api_version: moa.artifact/v1
kind: workflow
metadata:
  name: custom-logic-routing
  description: Deterministic skill with explicit conditional routing and bounded retry topology.
  tags:
    - pattern
    - custom-logic
status: draft
definition:
  type: workflow
  spec:
    input_schema:
      type: object
      properties:
        priority:
          type: string
        retry:
          type: boolean
    nodes:
      - id: start
        kind: start
        ui:
          x: 80
          y: 180
      - id: route_priority
        kind: condition
        ui:
          x: 280
          y: 180
      - id: escalate
        kind: sub_agent
        max_turns: 2
        input:
          task: Investigate the high-priority case and summarize blockers.
          task_name: high-priority-escalation
          tool_subset:
            - orders.lookup
            - knowledge.search
          budget_tokens: 3000
        ui:
          x: 520
          y: 90
      - id: standard_response
        kind: agent
        max_turns: 1
        input:
          prompt: Produce a concise standard response.
        ui:
          x: 520
          y: 270
      - id: retry_gate
        kind: condition
        ui:
          x: 760
          y: 180
      - id: done
        kind: end
        input:
          status: routed
        ui:
          x: 980
          y: 180
    edges:
      - id: start-route-priority
        from: start
        to: route_priority
      - id: route-priority-escalate
        from: route_priority
        to: escalate
        when:
          type: equals
          left: input.priority
          right: high
      - id: route-priority-standard-response
        from: route_priority
        to: standard_response
      - id: escalate-retry-gate
        from: escalate
        to: retry_gate
      - id: standard-response-retry-gate
        from: standard_response
        to: retry_gate
      - id: retry-gate-route-priority
        from: retry_gate
        to: route_priority
        when:
          type: exists
          path: input.retry
      - id: retry-gate-done
        from: retry_gate
        to: done
    ui:
      layout: dagre
      version: 1
