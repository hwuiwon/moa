api_version: moa.artifact/v1
kind: skill
metadata:
  name: damaged-food-order
  description: Skill with a deterministic procedure for damaged food delivery reports.
  tags:
    - support
    - food-delivery
status: draft
definition:
  type: skill
  spec:
    instructions:
      path: SKILL.md
    inputs:
      type: object
      properties:
        order_id:
          type: string
        evidence_summary:
          type: string
    procedure:
      input_schema:
        type: object
        properties:
          order_id:
            type: string
          evidence_summary:
            type: string
      state_schema:
        type: object
      nodes:
        - id: start
          kind: start
          ui:
            x: 80
            y: 160
        - id: verify_order
          kind: action
          ref: action://orders.get_order_info
          ui:
            x: 260
            y: 160
        - id: evidence_sufficient
          kind: condition
          condition:
            type: equals
            left: $.evidence.sufficient
            right: true
          ui:
            x: 460
            y: 160
        - id: reorder_confirmation
          kind: agent
          skill_refs:
            - skill://customer-reassurance
          max_turns: 2
          ui:
            x: 680
            y: 110
        - id: notify_restaurant
          kind: action
          ref: action://orders.submit_issue
          ui:
            x: 680
            y: 230
        - id: done
          kind: end
          ui:
            x: 900
            y: 160
      edges:
        - from: start
          to: verify_order
        - from: verify_order
          to: evidence_sufficient
        - from: evidence_sufficient
          to: reorder_confirmation
          when:
            type: equals
            left: $.evidence.sufficient
            right: true
        - from: evidence_sufficient
          to: notify_restaurant
          when:
            type: equals
            left: $.evidence.sufficient
            right: false
        - from: reorder_confirmation
          to: done
        - from: notify_restaurant
          to: done
ui:
  label: Damaged food order
  icon: package-x
  layout:
    canvas:
      width: 1024
      height: 420
reference_resolutions:
  - path: definition.spec.procedure.nodes[1].ref
    ref: action://orders.get_order_info
    state: unresolved
  - path: definition.spec.procedure.nodes[3].skill_refs[0]
    ref: skill://customer-reassurance
    state: unresolved
  - path: definition.spec.procedure.nodes[4].ref
    ref: action://orders.submit_issue
    state: unresolved
