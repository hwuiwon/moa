api_version: moa.artifact/v1
kind: skill
metadata:
  name: damaged-food-order
  description: Skill with a reusable execution plan for damaged food delivery reports.
  tags:
    - support
    - food-delivery
status: draft
definition:
  type: skill
  spec:
    instructions:
      path: SKILL.md
    inputs:
      type: object
      properties:
        order_id:
          type: string
        evidence_summary:
          type: string
    execution_plan:
      goal:
        requirements:
          - id: req_damaged_order
            description: Resolve the damaged-food order from verified evidence.
        deliverables: []
        coverage: []
        constraints: []
        completion_checks:
          - id: check_output
            description: Validate the final resolution output.
            requirement_ids: [req_damaged_order]
            constraint_ids: []
            kind:
              kind: output_schema
      plan:
        cancel_policy: retain_effects
        input_schema:
          type: object
          properties:
            order_id:
              type: string
            evidence_summary:
              type: string
        output_schema:
          type: object
        nodes:
          - id: verify_order
            requirement_ids: [req_damaged_order]
            depends_on: []
            input:
              order_id:
                $ref: $.input.order_id
              evidence_summary:
                $ref: $.input.evidence_summary
            output_schema:
              type: object
              required: [evidence_sufficient]
              properties:
                evidence_sufficient:
                  type: boolean
            operation:
              kind: capability
              reference:
                name: action://orders.get_order_info
                version: v1
            compensation: null
            retry:
              max_attempts: 2
              initial_backoff_ms: 100
              max_backoff_ms: 1000
          # The two nodes below are mutually exclusive branches on the same verified
          # value. Exactly one of them runs; the other is committed as `skipped`, which
          # releases its dependents for ordering without producing an output.
          #
          # A conditional node is an effectful leaf: nothing may read its output, because
          # a skipped branch has none. That is why the terminal output below reports the
          # verified order rather than whichever branch happened to fire, and why
          # `req_damaged_order` is also served by two unconditional nodes — a requirement
          # served only by conditional nodes could end a run with nothing eligible to
          # satisfy it.
          - id: reorder_confirmation
            requirement_ids: [req_damaged_order]
            depends_on: [verify_order]
            when:
              kind: equals
              reference:
                $ref: $.nodes.verify_order.output.evidence_sufficient
              value: true
            input:
              order:
                $ref: $.nodes.verify_order.output
            output_schema:
              type: object
            operation:
              kind: agent
              instructions: Confirm the replacement order and reassure the customer.
              skill_refs:
                - skill://customer-reassurance
              capability_refs: []
              max_turns: 2
            compensation: null
            retry:
              max_attempts: 1
              initial_backoff_ms: 0
              max_backoff_ms: 0
          - id: notify_restaurant
            requirement_ids: [req_damaged_order]
            depends_on: [verify_order]
            when:
              kind: equals
              reference:
                $ref: $.nodes.verify_order.output.evidence_sufficient
              value: false
            input:
              order:
                $ref: $.nodes.verify_order.output
            output_schema:
              type: object
            operation:
              kind: capability
              reference:
                name: action://orders.submit_issue
                version: v1
            compensation: null
            retry:
              max_attempts: 2
              initial_backoff_ms: 100
              max_backoff_ms: 1000
          - id: output
            requirement_ids: [req_damaged_order]
            depends_on: [verify_order, reorder_confirmation, notify_restaurant]
            input: {}
            output_schema:
              type: object
            operation:
              kind: output
              value:
                verified_order:
                  $ref: $.nodes.verify_order.output
            compensation: null
            retry:
              max_attempts: 1
              initial_backoff_ms: 0
              max_backoff_ms: 0
ui:
  label: Damaged food order
  icon: package-x
  layout:
    canvas:
      width: 1024
      height: 420
reference_resolutions:
  - path: definition.spec.execution_plan.plan.nodes[1].operation.skill_refs[0]
    ref: skill://customer-reassurance
    state: unresolved
