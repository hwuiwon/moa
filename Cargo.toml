    "crates/xtask",
]
default-members = [
    "crates/moa-core",
    "crates/moa-brain",
    "crates/moa-session",
    "crates/moa-memory/graph",
    "crates/moa-memory/ingest",
    "crates/moa-memory/lifecycle",
    "crates/moa-memory/pii",
    "crates/moa-memory/vector",
    "crates/moa-lineage/core",
    "crates/moa-lineage/citation",
    "crates/moa-lineage/sink",
    "crates/moa-lineage/otel",
    "crates/moa-lineage/audit",
    "crates/moa-auth/authz-schema",
    "crates/moa-auth/authz",
    "crates/moa-ocsf",
    "crates/moa-auth/providers",
    "crates/moa-auth/auth0",
    "crates/moa-auth/fga-bootstrap",
    "crates/moa-edge",
    "crates/moa-hands",
    "crates/moa-providers",
    "crates/moa-orchestrator",
