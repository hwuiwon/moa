[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
moa-auth-providers = { path = "crates/moa-auth/providers" }
moa-auth-providers-auth0 = { path = "crates/moa-auth/auth0" }
moa-authz = { path = "crates/moa-auth/authz" }
moa-authz-schema = { path = "crates/moa-auth/authz-schema" }
moa-brain = { path = "crates/moa-brain" }
moa-core = { path = "crates/moa-core" }
moa-edge = { path = "crates/moa-edge" }
moa-eval-core = { path = "crates/moa-eval/core" }
moa-eval = { path = "crates/moa-eval" }
moa-fga-bootstrap = { path = "crates/moa-auth/fga-bootstrap" }
moa-gateway = { path = "crates/moa-gateway" }
moa-hands = { path = "crates/moa-hands" }
moa-lineage-audit = { path = "crates/moa-lineage/audit" }
moa-lineage-citation = { path = "crates/moa-lineage/citation" }
moa-lineage-core = { path = "crates/moa-lineage/core" }
moa-lineage-otel = { path = "crates/moa-lineage/otel" }
moa-lineage-sink = { path = "crates/moa-lineage/sink" }
moa-loadtest = { path = "crates/moa-loadtest" }
moa-memory-graph = { path = "crates/moa-memory/graph" }
moa-memory-ingest = { path = "crates/moa-memory/ingest" }
moa-memory-lifecycle = { path = "crates/moa-memory/lifecycle" }
moa-memory-pii = { path = "crates/moa-memory/pii" }
moa-memory-vector = { path = "crates/moa-memory/vector" }
moa-ocsf = { path = "crates/moa-ocsf" }
moa-orchestrator = { path = "crates/moa-orchestrator" }
moa-providers = { path = "crates/moa-providers" }
moa-security = { path = "crates/moa-security" }
moa-session = { path = "crates/moa-session" }
moa-skills = { path = "crates/moa-skills" }
moa-test-support = { path = "crates/moa-test-support" }
workspace-hack = { path = "crates/workspace-hack" }
xtask = { path = "crates/xtask" }
anyhow = "1"
argon2 = "0.5"
arrow = "53"
async-trait = "0.1"
async-openai = { version = "0.34", default-features = false, features = [
    "responses",
    "rustls",
] }
axum = "0.8"
backon = "1"
base64 = "0.22"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crc32fast = "1.4"
dirs = "5"
ed25519-dalek = "2"
eventsource-stream = "0.2"
envy = "0.4"
futures-util = "0.3"
globset = "0.4"
hex = "0.4"
hmac = "0.12"
constant_time_eq = "0.3"
insta = { version = "1", features = ["json", "redactions"] }
jsonwebtoken = "9.3"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", features = ["http-listener"] }
moka = { version = "0.12", features = ["future"] }
object_store = { version = "0.11", features = ["aws"] }
opentelemetry = "0.31"
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "grpc-tonic", "http-proto", "reqwest-rustls"] }
opentelemetry_sdk = "0.31"
httpmock = "0.7"
parquet = { version = "53", features = ["async", "arrow"] }
proptest = "1"
rand = "0.8"
regex = "1"
restate-sdk = "0.8"
rust-stemmers = "1"
restate-sdk-shared-core = "0.8"
reqwest = { version = "0.13", default-features = false, features = [
    "http2",
    "json",
    "multipart",
    "rustls",
    "stream",
] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_canonical_json = "1"
serde_json = "1"
sha2 = "0.10"
shell-words = "1.1"
similar = "2"
subtle = "2"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
] }
strum = { version = "0.27", features = ["derive"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-metrics = "0.4"
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = "0.6"
url = "2.5"
uuid = { version = "1", features = ["serde", "v7"] }
wiremock = "0.6"
testcontainers = "0.23"

[workspace.metadata.hakari]
hakari-package = "workspace-hack"
resolver = "2"
platforms = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[workspace.metadata.cargo-machete]
ignored = ["workspace-hack"]

[profile.dev]
# 1 = Line tables only. Enough for AI to see "Error at main.rs:42"
# This is the single biggest space saver.
debug = 1

# Speed up the linker by keeping debug info in separate files 
# (Works on macOS and Linux).
split-debuginfo = "unpacked"

# Optional: If your code is heavy on dependencies, level 1 
# makes the AI's "test/run" cycles much faster.
opt-level = 1

[profile.release]
# Strip all symbols from the final production binary.
strip = "symbols"
# Use 'thin' LTO to keep the binary small without the 
# massive compile time of 'fat' LTO.
lto = "thin"
# No debug info needed for release.
debug = 0
