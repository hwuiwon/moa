groups:
  - name: moa-lineage
    interval: 60s
    rules:
      - alert: MOALineageDropping
        expr: rate(moa_lineage_dropped_total[5m]) > 0
        for: 5m
        annotations:
          summary: Lineage events being dropped
          description: "{{ $value }} events/sec dropped on {{ $labels.instance }}. Increase channel_capacity or investigate writer backpressure."

      - alert: MOALineageWriterStuck
        expr: rate(moa_lineage_enqueued_total[5m]) > 0 and rate(moa_lineage_flushed_total[5m]) == 0
        for: 10m
        annotations:
          summary: Lineage writer is not flushing
          description: "Capture is alive but the writer has not flushed in 10 minutes. Check Postgres connectivity and fjall disk space."

# The grounding-rate, zero-recall, and cost-per-turn alerts previously in this file
# read per-tenant-labeled brain metrics (moa_grounding_verified_rate,
# moa_zero_recall_count, moa_turn_count, moa_cost_micros_per_turn) that were deleted
# for unbounded cardinality. Those alerts now run as Grafana SQL rules over the
# analytics tables — see dashboards/grafana/alerting/moa-quality-alerts.yaml.
