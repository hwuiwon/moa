# docker-compose.yml — Required for local MOA development.
# Production uses managed Postgres / Neon, not this compose stack.

services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
      args:
        PGVECTOR_REF: v0.8.2
    image: moa-postgres:pg17-pgvector0.8.2-pgaudit
    container_name: moa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: moa
      POSTGRES_USER: moa_owner
      POSTGRES_PASSWORD: dev
    command:
      - postgres
      - -c
      - shared_preload_libraries=pgaudit
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - logging_collector=on
      - -c
      - log_destination=stderr,csvlog
      - -c
      - log_directory=/var/log/postgresql
      - -c
      - log_rotation_age=60min
      - -c
      - log_rotation_size=0
      - -c
      - pgaudit.log=write,ddl,role
      - -c
      - pgaudit.log_relation=on
      - -c
      - pgaudit.log_parameter=off
      - -c
      - pgaudit.log_parameter_max_size=0
      - -c
      - pgaudit.log_catalog=off
      - -c
      - pgaudit.log_statement_once=on
    ports:
      - "10040:5432"
    volumes:
      - moa-pg-data:/var/lib/postgresql/data
      - moa-pg-audit:/var/log/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moa_owner -d moa"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  valkey:
    image: valkey/valkey:8-alpine
    container_name: moa-valkey
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "10051:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  openfga-db-init:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-dev}
    entrypoint:
      - sh
      - -c
      - |
        set -e
        psql -h postgres -U moa_owner -d postgres -tAc \
          "SELECT 1 FROM pg_database WHERE datname='openfga'" \
        | grep -q 1 || \
          psql -h postgres -U moa_owner -d postgres \
          -c "CREATE DATABASE openfga OWNER moa_owner"
        echo "openfga db ready"
    restart: "no"

  openfga-migrate:
    image: openfga/openfga:v1.8.16
    depends_on:
      openfga-db-init:
        condition: service_completed_successfully
    command: ["migrate"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://moa_owner:${POSTGRES_PASSWORD:-dev}@postgres:5432/openfga?sslmode=disable
    restart: "no"

  openfga:
    image: openfga/openfga:v1.8.16
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    command: ["run"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://moa_owner:${POSTGRES_PASSWORD:-dev}@postgres:5432/openfga?sslmode=disable
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: ${MOA_AUTHZ_OPENFGA_PRESHARED_KEY:-localdev-preshared-key-do-not-use-in-prod}
      OPENFGA_LOG_FORMAT: json
      OPENFGA_PLAYGROUND_ENABLED: "true"
    ports:
      - "10030:8080"
      - "10031:8081"
      - "10032:3000"
    healthcheck:
      test: ["CMD", "/openfga", "version"]
      interval: 5s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    container_name: moa-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${MOA_SESSION_ATTACHMENT_ACCESS_KEY_ID:-moaadmin}
      RUSTFS_SECRET_KEY: ${MOA_SESSION_ATTACHMENT_SECRET_ACCESS_KEY:-moa-local-dev-secret}
      RUSTFS_REGION: ${MOA_SESSION_ATTACHMENT_REGION:-us-east-1}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["/data"]
    ports:
      # Host ports are configurable because 9000/9001 are popular (minio,
      # k3d node ports); in-network consumers always use rustfs:9000.
      - "${MOA_RUSTFS_PORT:-9000}:9000"
      - "${MOA_RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - moa-rustfs-data:/data

  rustfs-init:
    image: rustfs/rc:latest
    container_name: moa-rustfs-init
    restart: "no"
    depends_on:
      rustfs:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until rc alias set --quiet --bucket-lookup path --region "$${MOA_SESSION_ATTACHMENT_REGION:-us-east-1}" rustfs http://rustfs:9000 "$${MOA_SESSION_ATTACHMENT_ACCESS_KEY_ID:-moaadmin}" "$${MOA_SESSION_ATTACHMENT_SECRET_ACCESS_KEY:-moa-local-dev-secret}"; do
          sleep 1
        done
        rc bucket create --ignore-existing --region "$${MOA_SESSION_ATTACHMENT_REGION:-us-east-1}" "rustfs/$${MOA_SESSION_ATTACHMENT_BUCKET:-moa-session-attachments}"
    environment:
      MOA_SESSION_ATTACHMENT_ACCESS_KEY_ID: ${MOA_SESSION_ATTACHMENT_ACCESS_KEY_ID:-moaadmin}
      MOA_SESSION_ATTACHMENT_SECRET_ACCESS_KEY: ${MOA_SESSION_ATTACHMENT_SECRET_ACCESS_KEY:-moa-local-dev-secret}
      MOA_SESSION_ATTACHMENT_BUCKET: ${MOA_SESSION_ATTACHMENT_BUCKET:-moa-session-attachments}
      MOA_SESSION_ATTACHMENT_REGION: ${MOA_SESSION_ATTACHMENT_REGION:-us-east-1}

  restate:
    image: docker.restate.dev/restatedev/restate:1.7.0
    container_name: moa-restate
    restart: unless-stopped
    command: ["--node-name=restate-dev"]
    environment:
      RESTATE_LOG_FILTER: "warn,restate=info"
      # v1.7 limitation: vqueues can only be enabled on a cluster with no
      # in-flight invocations; wipe the moa-restate-data volume if the node
      # refuses to boot after upgrading.
      RESTATE_EXPERIMENTAL_ENABLE_VQUEUES: "true"
      RESTATE_ROCKSDB_TOTAL_MEMORY_SIZE: "1 GiB"
      RESTATE_ADMIN__QUERY_ENGINE__MEMORY_SIZE: "256 MiB"
      RESTATE_BIFROST__RECORD_CACHE_MEMORY_SIZE: "128 MiB"
      DO_NOT_TRACK: "1"
    ports:
      - "10010:8080"
      - "10011:9070"
      - "10012:5122"
    volumes:
      - moa-restate-data:/restate-data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9070/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  moa-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MOA_ORCHESTRATOR_FEATURES: provider-overrides
    image: moa/orchestrator:dev
    container_name: moa-orchestrator
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      restate:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    environment:
      HOME: /var/lib/moa
      MOA_DATABASE_URL: postgres://moa_owner:dev@postgres:5432/moa
      MOA_RESTATE_ADMIN_URL: http://restate:9070
      MOA_RESTATE_INGRESS_URL: http://restate:8080
      MOA_RUNTIME_CACHE_BACKEND: redis
      MOA_RUNTIME_CACHE_REDIS_URL: redis://valkey:6379/0
      MOA_LOCAL_SANDBOX_DIR: /var/lib/moa/sandbox
      MOA_LOCAL_MEMORY_DIR: /var/lib/moa/memory
      MOA_OBSERVABILITY_LINEAGE_JOURNAL_PATH: /var/lib/moa/lineage-journal
      MOA_LINEAGE_SINK: postgres
      MOA_CLICKHOUSE_URL: ${MOA_CLICKHOUSE_URL:-}
      MOA_CLICKHOUSE_USER: ${MOA_CLICKHOUSE_USER:-}
      MOA_CLICKHOUSE_PASSWORD: ${MOA_CLICKHOUSE_PASSWORD:-}
      MOA_SKIP_FGA: ${MOA_SKIP_FGA:-}
      MOA_AUTHZ_OPENFGA_URL: http://openfga:8080
      MOA_AUTHZ_OPENFGA_PRESHARED_KEY: ${MOA_AUTHZ_OPENFGA_PRESHARED_KEY:-localdev-preshared-key-do-not-use-in-prod}
      MOA_AUTHZ_OPENFGA_STORE_ID: ${MOA_AUTHZ_OPENFGA_STORE_ID:-}
      MOA_AUTHZ_OPENFGA_MODEL_ID: ${MOA_AUTHZ_OPENFGA_MODEL_ID:-}
      MOA_SESSION_ATTACHMENT_ENDPOINT: http://rustfs:9000
      MOA_SESSION_ATTACHMENT_BUCKET: ${MOA_SESSION_ATTACHMENT_BUCKET:-moa-session-attachments}
      MOA_SESSION_ATTACHMENT_REGION: ${MOA_SESSION_ATTACHMENT_REGION:-us-east-1}
      MOA_SESSION_ATTACHMENT_ACCESS_KEY_ID: ${MOA_SESSION_ATTACHMENT_ACCESS_KEY_ID:-moaadmin}
      MOA_SESSION_ATTACHMENT_SECRET_ACCESS_KEY: ${MOA_SESSION_ATTACHMENT_SECRET_ACCESS_KEY:-moa-local-dev-secret}
      MOA_SESSION_ATTACHMENT_ALLOW_HTTP: "true"
      MOA_SESSION_ATTACHMENT_VIRTUAL_HOSTED_STYLE: "false"
      MOA_PROVIDERS_OVERRIDE: ${MOA_PROVIDERS_OVERRIDE:-}
      # Development-only: the local hand provider is fail-closed by default
      # and must be opted into explicitly outside production.
      MOA_CLOUD_HANDS_ALLOW_LOCAL: "true"
      MOA_REQUIRE_RESTATE_REGISTRATION_FOR_READINESS: "false"
      MOA_DEREGISTER_ON_SHUTDOWN: "false"
      MOA_METRICS_ENABLED: ${MOA_METRICS_ENABLED:-true}
      MOA_METRICS_LISTEN: 0.0.0.0:9090
      RUST_LOG: "info,moa_orchestrator=debug"
      MOA_ANTHROPIC_API_KEY: ${MOA_ANTHROPIC_API_KEY:-}
      MOA_OPENAI_API_KEY: ${MOA_OPENAI_API_KEY:-}
      MOA_GOOGLE_API_KEY: ${MOA_GOOGLE_API_KEY:-}
      MOA_COHERE_API_KEY: ${MOA_COHERE_API_KEY:-}
      MOA_ZEROENTROPY_API_KEY: ${MOA_ZEROENTROPY_API_KEY:-}
      # Contact-token signing keys are opt-in via docker-compose.edge.yml:
      # an empty MOA_AUTH_CONTACT_TOKENS_* value counts as "section
      # configured" and hard-fails config loading, so they must not be
      # passed through unconditionally here.
    ports:
      # Restate handler port 9080 is internal-only. Use moa-edge on 8080.
      - "10021:9081"
      # SCIM v2 provisioning endpoint.
      - "10022:10022"
      # Prometheus metrics; scraped by moa-loadtest step-latency reports.
      - "10023:9090"
    volumes:
      - ./crates/moa-loadtest/scripts:/loadtest-scripts:ro

  moa-edge:
    build:
      context: .
      dockerfile: crates/moa-edge/Dockerfile
    image: moa/edge:dev
    container_name: moa-edge
    restart: unless-stopped
    depends_on:
      moa-orchestrator:
        condition: service_started
      rustfs-init:
        condition: service_completed_successfully
    environment:
      MOA_EDGE_BIND: 0.0.0.0:8080
      MOA_EDGE_UPSTREAM: http://restate:8080
      MOA_DATABASE_URL: postgres://moa_owner:${POSTGRES_PASSWORD:-dev}@postgres:5432/moa?sslmode=disable
      MOA_SESSION_ATTACHMENT_ENDPOINT: http://rustfs:9000
      MOA_SESSION_ATTACHMENT_BUCKET: ${MOA_SESSION_ATTACHMENT_BUCKET:-moa-session-attachments}
      MOA_SESSION_ATTACHMENT_REGION: ${MOA_SESSION_ATTACHMENT_REGION:-us-east-1}
      MOA_SESSION_ATTACHMENT_ACCESS_KEY_ID: ${MOA_SESSION_ATTACHMENT_ACCESS_KEY_ID:-moaadmin}
      MOA_SESSION_ATTACHMENT_SECRET_ACCESS_KEY: ${MOA_SESSION_ATTACHMENT_SECRET_ACCESS_KEY:-moa-local-dev-secret}
      MOA_SESSION_ATTACHMENT_ALLOW_HTTP: "true"
      MOA_SESSION_ATTACHMENT_VIRTUAL_HOSTED_STYLE: "false"
      MOA_CLICKHOUSE_URL: ${MOA_CLICKHOUSE_URL:-}
      MOA_CLICKHOUSE_USER: ${MOA_CLICKHOUSE_USER:-}
      MOA_CLICKHOUSE_PASSWORD: ${MOA_CLICKHOUSE_PASSWORD:-}
      MOA_METRICS_ENABLED: ${MOA_METRICS_ENABLED:-true}
      MOA_METRICS_LISTEN: 0.0.0.0:9090
      RUST_LOG: info,moa_edge=debug
    ports:
      - "10000:8080"
      # Prometheus metrics for the edge layer.
      - "10001:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 12

  restate-register:
    image: curlimages/curl:8.10.1
    container_name: moa-restate-register
    restart: "no"
    depends_on:
      restate:
        condition: service_healthy
      moa-orchestrator:
        condition: service_started
    environment:
      MOA_RESTATE_ADMIN_URL: http://restate:9070
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "registering moa-orchestrator with Restate admin..."
        attempt=1
        while [ "$$attempt" -le 30 ]; do
          status=$$(curl -sS -o /tmp/register-response.txt -w "%{http_code}" \
            -X POST "$${MOA_RESTATE_ADMIN_URL}/deployments" \
            -H "content-type: application/json" \
            --data '{"uri":"http://moa-orchestrator:9080"}' || true)
          if [ "$$status" -ge 200 ] && [ "$$status" -lt 300 ] || [ "$$status" = "409" ]; then
            echo "registration complete"
            exit 0
          fi
          echo "registration attempt $${attempt} failed with status $${status}; retrying..."
          attempt=$$((attempt + 1))
          sleep 2
        done
        echo "registration failed"
        exit 1

  # Seeds the cluster-wide Restate flow-control rule book once the node is healthy.
  # The `*` rule gives every scope key (the edge uses `tenant-{tenant_id}`) its own
  # concurrency counter capped at 1000, so no tenant can exhaust cluster capacity.
  # `rules set` is idempotent, so a re-run just overwrites the same default.
  restate-rules-bootstrap:
    image: docker.restate.dev/restatedev/restate-cli:1.7.0
    container_name: moa-restate-rules-bootstrap
    restart: "no"
    depends_on:
      restate:
        condition: service_healthy
    environment:
      RESTATE_ADMIN_URL: http://restate:9070
    command:
      - --connect-timeout
      - "10000"
      - --request-timeout
      - "30000"
      - rules
      - set
      - "*"
      - --concurrency
      - "1000"
      - --description
      - scope default

  moa-pii-service:
    build:
      context: .
      dockerfile: services/pii-service/Dockerfile
    image: moa/pii-service:0.1
    container_name: moa-pii-service
    restart: unless-stopped
    environment:
      MODEL: openai/privacy-filter
      DEVICE: cpu
      HF_HUB_DISABLE_XET: "1"
    ports:
      - "10050:8080"
    volumes:
      - moa-pii-hf-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)\""]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 60s

  moa-audit-shipper:
    build:
      context: .
      dockerfile: services/audit-shipper/Dockerfile
    image: moa/audit-shipper:0.1
    container_name: moa-audit-shipper
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AWS_REGION: us-east-1
      BUCKET: moa-audit-dev
      OBJECT_LOCK_DAYS: "2190"
      LOG_DIR: /var/log/postgresql
      LOG_GLOB: "*.log,*.csv"
      STATE_DIR: /var/lib/moa-audit-shipper
      POLL_INTERVAL_SECONDS: "60"
    volumes:
      - moa-pg-audit:/var/log/postgresql:ro
      - moa-audit-shipper-state:/var/lib/moa-audit-shipper

  clickhouse:
    # Optional analytics store for high-volume lineage rows. Start with
    # `docker compose --profile clickhouse up -d`, then set
    # MOA_CLICKHOUSE_URL=http://clickhouse:8123 (plus user/password below)
    # in .env so the orchestrator and edge switch turn_lineage to ClickHouse.
    image: clickhouse/clickhouse-server:25.5
    container_name: moa-clickhouse
    restart: unless-stopped
    profiles: ["clickhouse"]
    environment:
      CLICKHOUSE_DB: moa
      CLICKHOUSE_USER: moa
      CLICKHOUSE_PASSWORD: dev
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "10061:8123"
    volumes:
      - moa-clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  moa-clickhouse-data:
  moa-pg-data:
  moa-pg-audit:
  moa-audit-shipper-state:
  moa-pii-hf-cache:
  moa-restate-data:
  moa-rustfs-data:
