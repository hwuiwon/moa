path_prefixes = [
  "crates/moa-skills/",
  "crates/moa-experiments/",
  "crates/moa-eval/",
  "crates/moa-loadtest/",
  "crates/moa-test-support/",
]
docs = [
  "docs/09-skills-and-learning.md",
  "docs/16-evaluation.md",
  "docs/20-testing.md",
  "docs/22-load-and-chaos-testing.md",
]
