apiVersion: v1
kind: Service
metadata:
  name: moa-orchestrator
  namespace: moa-system
  labels:
    app.kubernetes.io/name: moa-orchestrator
    app.kubernetes.io/part-of: moa
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: moa-orchestrator
    app.kubernetes.io/part-of: moa
  ports:
    - name: restate
      port: 9080
      targetPort: restate
    - name: health
      port: 9081
      targetPort: health
    # Private connector-credential and provider-callback ingress. ClusterIP plus the orchestrator
    # NetworkPolicy limits this port to moa-edge pods in moa-system.
    - name: internal
      port: 10023
      targetPort: internal
