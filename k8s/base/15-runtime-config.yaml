apiVersion: v1
kind: ConfigMap
metadata:
  name: moa-runtime-config
  namespace: moa-system
data:
  # Base/local renders the development posture explicitly: host-local hands with
  # a permissive permission default. The production overlay patches both to the
  # fail-closed cloud contract; neither value is ever inferred.
  MOA_SECURITY_PROFILE: local
  MOA_PERMISSIONS_DEFAULT_EFFECT: allow
  MOA_CLOUD_HANDS_DEFAULT_PROVIDER: local
  # Durable workspaces are dark unless an operator deliberately selects the
  # maintenance or canary-admission rollout state.
  MOA_SANDBOX_WORKSPACE_MODE: disabled
  MOA_SANDBOX_WORKSPACE_RECONCILIATION_CLAIM_TTL_SECONDS: "60"
  # Deployment sandbox policy layer. This local-profile overlay states the
  # deliberately unbounded development policy explicitly; a cloud overlay must
  # replace it, because MOA_SECURITY_PROFILE=cloud refuses to start on the
  # built-in `local-development-unbounded` revision.
  MOA_SANDBOX_POLICY_JSON: >-
    {"deployment":{"revision":"local-development-unbounded",
    "cpu":{"mode":"unbounded"},"memory":{"mode":"unbounded"},
    "ephemeral_disk":{"mode":"unbounded"},"egress":{"mode":"unrestricted"},
    "idle_timeout":{"mode":"unbounded"},"max_lifetime":{"mode":"unbounded"}}}
  # Every KMS-capable replica shares Postgres state and the same immutable
  # generation-named keyring. Root-key material remains in a Secret volume.
  MOA_KMS_PROVIDER: postgres
  MOA_KMS_ROOT_KEY_DIR: /var/run/secrets/moa-kms/root-keys
  MOA_KMS_REQUIRED_GENERATION: primary
