apiVersion: v1
kind: ServiceAccount
metadata:
  name: moa-restate-bootstrap
  namespace: moa-system
  labels:
    app.kubernetes.io/name: moa-restate-bootstrap
    app.kubernetes.io/part-of: moa
    app.kubernetes.io/component: bootstrap
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  # Production rendering replaces this placeholder with a deterministic suffix
  # derived from the immutable orchestrator image digest.
  name: moa-restate-bootstrap-image-revision
  namespace: moa-system
  labels:
    app.kubernetes.io/name: moa-restate-bootstrap
    app.kubernetes.io/part-of: moa
    app.kubernetes.io/component: bootstrap
  annotations:
    moa.dev/image-revision: "image-revision"
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: moa-restate-bootstrap
        app.kubernetes.io/part-of: moa
        app.kubernetes.io/component: bootstrap
    spec:
      serviceAccountName: moa-restate-bootstrap
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: moa/orchestrator:latest
          command:
            - /bin/sh
            - -ec
          args:
            - >-
              exec /usr/local/bin/moa-orchestrator bootstrap
              --admin-url http://restate.moa-restate.svc.cluster.local:9070
              --ingress-url http://restate.moa-restate.svc.cluster.local:8080
              --database-url "$MOA_BOOTSTRAP_DATABASE_URL"
              --migration-deployment-uri http://moa-session-status-migrator.moa-system.svc.cluster.local:9080
          env:
            - name: MOA_BOOTSTRAP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: moa-postgres
                  key: admin-url
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
