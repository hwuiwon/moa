apiVersion: restate.dev/v1beta1
kind: RestateDeployment
metadata:
  name: moa-orchestrator
  namespace: moa-system
spec:
  replicas: 6
  # The operator applies this HPA spec only to non-latest revisions that still
  # own active invocations. Old versions retain one recovery replica but shed
  # the six-replica serving footprint while long-lived journals drain.
  autoscaling:
    minReplicas: 1
    maxReplicas: 6
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 60
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        policies:
          - type: Percent
            value: 100
            periodSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 120
        policies:
          - type: Percent
            value: 50
            periodSeconds: 60
  restate:
    register:
      cluster: moa-restate
  selector:
    matchLabels:
      app.kubernetes.io/name: moa-orchestrator
      app.kubernetes.io/part-of: moa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: moa-orchestrator
        app.kubernetes.io/part-of: moa
    spec:
      terminationGracePeriodSeconds: 600
      initContainers:
        # The migration-only Job owns DDL and the raw Restate KV rewrite. A
        # normal replica receives only the runtime database credential and
        # cannot start its hard-break reader before that stage writes a receipt.
        - name: wait-status-cutover
          image: moa/orchestrator:latest
          command:
            - /bin/sh
            - -ec
          args:
            - >-
              exec /usr/local/bin/moa-orchestrator wait-status-cutover
              --database-url "$MOA_CUTOVER_DATABASE_URL"
          env:
            - name: MOA_CUTOVER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: moa-postgres
                  key: url
      containers:
        - name: orchestrator
          image: moa/orchestrator:latest
          args:
            - --port
            - "9080"
            - --health-port
            - "9081"
            - --credential-port
            - "10023"
          ports:
            - name: restate
              containerPort: 9080
            - name: health
              containerPort: 9081
            - name: internal
              containerPort: 10023
          readinessProbe:
            httpGet:
              path: /_health/ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /_health/live
              port: health
            initialDelaySeconds: 30
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /_health/live
              port: health
            failureThreshold: 30
            periodSeconds: 10
          envFrom:
            - configMapRef:
                name: moa-runtime-config
          env:
            - name: RUST_LOG
              value: warn,moa_orchestrator=info,moa_brain=info,moa_edge=info,async_openai::error=off
            # Stable for this process lifetime and unique across replicas. The
            # shared telemetry resource maps it to service.instance.id.
            - name: MOA_SERVICE_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: MOA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: moa-postgres
                  key: url
            - name: MOA_DATABASE_MAINTENANCE_URL
              valueFrom:
                secretKeyRef:
                  name: moa-postgres-maintenance
                  key: url
                  optional: true
            # Fleet budget: 50 HPA replicas reserve 20 foreground + 1 background
            # connection = 1,050. Edge reserves 24, leaving 126 connections for
            # migrations, deploy overlap, and operators in a 1,200-connection tier.
            - name: MOA_DATABASE_MAX_CONNECTIONS
              value: "20"
            - name: MOA_DATABASE_BACKGROUND_MAX_CONNECTIONS
              value: "1"
            - name: MOA_DATABASE_CONNECT_TIMEOUT_SECONDS
              value: "3"
            - name: MOA_ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: moa-llm-keys
                  key: anthropic
                  optional: true
            - name: MOA_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: moa-llm-keys
                  key: openai
                  optional: true
            - name: MOA_GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: moa-llm-keys
                  key: google
                  optional: true
            - name: MOA_COHERE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: moa-llm-keys
                  key: cohere
                  optional: true
            - name: MOA_ZEROENTROPY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: moa-llm-keys
                  key: zeroentropy
                  optional: true
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: moa-llm-keys
                  key: openrouter
                  optional: true
            - name: MOA_RESTATE_INGRESS_URL
              value: http://restate.moa-restate.svc.cluster.local:8080
            # Keep the capacity experiment off in production until its A/B wins.
            - name: MOA_SESSION_DIRECT_TURN_EVENT_APPEND
              value: "false"
            - name: MOA_RUNTIME_CACHE_BACKEND
              value: redis
            - name: MOA_RUNTIME_CACHE_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: moa-runtime-cache
                  key: redis-url
            # Push, not scrape. Production runs behind a non-sticky Service with an
            # autoscaled replica count, so a scrape through that Service lands on an
            # arbitrary replica each interval and blends unrelated processes into one
            # series. There is deliberately no listen address here: a configured but
            # unbound port reads to operators, manifests and network policies as a
            # scrape endpoint that exists.
            - name: MOA_METRICS_EXPORTER
              value: otlp
          volumeMounts:
            - name: kms-root-keys
              mountPath: /var/run/secrets/moa-kms/root-keys
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: kms-root-keys
          secret:
            secretName: moa-kms-root-keys
