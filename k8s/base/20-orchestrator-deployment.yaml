apiVersion: restate.dev/v1beta1
kind: RestateDeployment
metadata:
  name: moa-orchestrator
  namespace: moa-system
spec:
  replicas: 6
  restate:
    register:
      cluster: moa-restate
  selector:
    matchLabels:
      app.kubernetes.io/name: moa-orchestrator
      app.kubernetes.io/part-of: moa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: moa-orchestrator
        app.kubernetes.io/part-of: moa
    spec:
      terminationGracePeriodSeconds: 600
      containers:
        - name: orchestrator
          image: ghcr.io/hwuiwon/moa-orchestrator:latest
          args:
            - --port
            - "9080"
            - --health-port
            - "9081"
          ports:
            - name: restate
              containerPort: 9080
            - name: health
              containerPort: 9081
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /_health/ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /_health/live
              port: health
            initialDelaySeconds: 30
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /_health/live
              port: health
            failureThreshold: 30
            periodSeconds: 10
          env:
            - name: RUST_LOG
              value: info
            - name: MOA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: moa-postgres
                  key: url
            - name: MOA_ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: moa-llm-keys
                  key: anthropic
                  optional: true
            - name: MOA_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: moa-llm-keys
                  key: openai
                  optional: true
            - name: MOA_GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: moa-llm-keys
                  key: google
                  optional: true
            - name: MOA_COHERE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: moa-llm-keys
                  key: cohere
                  optional: true
            - name: MOA_ZEROENTROPY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: moa-llm-keys
                  key: zeroentropy
                  optional: true
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: moa-llm-keys
                  key: openrouter
                  optional: true
            - name: MOA_RESTATE_ADMIN_URL
              value: http://restate.moa-restate.svc.cluster.local:9070
            - name: MOA_RESTATE_INGRESS_URL
              value: http://restate.moa-restate.svc.cluster.local:8080
            - name: MOA_RUNTIME_CACHE_BACKEND
              value: redis
            - name: MOA_RUNTIME_CACHE_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: moa-runtime-cache
                  key: redis-url
            - name: MOA_METRICS_ENABLED
              value: "true"
            - name: MOA_METRICS_LISTEN
              value: 0.0.0.0:9090
            # Gate readiness on the orchestrator's Restate services (Session, Worker,
            # TurnExecution, WorkerTurnExecution, ...) being registered with the cluster,
            # so non-sticky traffic never lands on a replica whose handlers aren't live.
            # Bootstrap is deadlock-free: the pod goes live via /_health/live, the
            # RestateDeployment operator registers it, then /_health/ready passes.
            - name: MOA_REQUIRE_RESTATE_REGISTRATION_FOR_READINESS
              value: "true"
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
