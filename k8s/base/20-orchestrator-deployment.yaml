apiVersion: restate.dev/v1beta1
kind: RestateDeployment
metadata:
  name: moa-orchestrator
  namespace: moa-system
spec:
  replicas: 6
  restate:
    register:
      cluster: moa-restate
  selector:
    matchLabels:
      app.kubernetes.io/name: moa-orchestrator
      app.kubernetes.io/part-of: moa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: moa-orchestrator
        app.kubernetes.io/part-of: moa
    spec:
      terminationGracePeriodSeconds: 600
      initContainers:
        # Converge the required per-scope Restate rule before this pod can
        # accept work. `rules set` is idempotent across replica startups.
        - name: restate-rules-bootstrap
          image: docker.restate.dev/restatedev/restate-cli:1.7.0
          env:
            - name: RESTATE_ADMIN_URL
              value: http://restate.moa-restate.svc.cluster.local:9070
          args:
            - --connect-timeout
            - "10000"
            - --request-timeout
            - "30000"
            - rules
            - set
            - "*"
            - --concurrency
            - "1000"
            - --description
            - scope default
      containers:
        - name: orchestrator
          image: ghcr.io/hwuiwon/moa-orchestrator:latest
          args:
            - --port
            - "9080"
            - --health-port
            - "9081"
          ports:
            - name: restate
              containerPort: 9080
            - name: health
              containerPort: 9081
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /_health/ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /_health/live
              port: health
            initialDelaySeconds: 30
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /_health/live
              port: health
            failureThreshold: 30
            periodSeconds: 10
          envFrom:
            - configMapRef:
                name: moa-runtime-config
          env:
            - name: RUST_LOG
              value: info
            - name: MOA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: moa-postgres
                  key: url
            # Fleet budget: 50 HPA replicas reserve 20 foreground + 1 background
            # connection = 1,050. Edge reserves 24, leaving 126 connections for
            # migrations, deploy overlap, and operators in a 1,200-connection tier.
            - name: MOA_DATABASE_MAX_CONNECTIONS
              value: "20"
            - name: MOA_DATABASE_BACKGROUND_MAX_CONNECTIONS
              value: "1"
            - name: MOA_DATABASE_CONNECT_TIMEOUT_SECONDS
              value: "3"
            - name: MOA_ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: moa-llm-keys
                  key: anthropic
                  optional: true
            - name: MOA_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: moa-llm-keys
                  key: openai
                  optional: true
            - name: MOA_GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: moa-llm-keys
                  key: google
                  optional: true
            - name: MOA_COHERE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: moa-llm-keys
                  key: cohere
                  optional: true
            - name: MOA_ZEROENTROPY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: moa-llm-keys
                  key: zeroentropy
                  optional: true
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: moa-llm-keys
                  key: openrouter
                  optional: true
            - name: MOA_RESTATE_ADMIN_URL
              value: http://restate.moa-restate.svc.cluster.local:9070
            - name: MOA_RESTATE_INGRESS_URL
              value: http://restate.moa-restate.svc.cluster.local:8080
            # Keep the capacity experiment off in production until its A/B wins.
            - name: MOA_SESSION_DIRECT_TURN_EVENT_APPEND
              value: "false"
            - name: MOA_RUNTIME_CACHE_BACKEND
              value: redis
            - name: MOA_RUNTIME_CACHE_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: moa-runtime-cache
                  key: redis-url
            - name: MOA_METRICS_ENABLED
              value: "true"
            - name: MOA_METRICS_LISTEN
              value: 0.0.0.0:9090
            # Gate readiness on the orchestrator's Restate services (Session, Worker,
            # TurnExecution, WorkerTurnExecution, ...) being registered with the cluster,
            # so non-sticky traffic never lands on a replica whose handlers aren't live.
            # Bootstrap is deadlock-free: the pod goes live via /_health/live, the
            # RestateDeployment operator registers it, then /_health/ready passes.
            - name: MOA_REQUIRE_RESTATE_REGISTRATION_FOR_READINESS
              value: "true"
          volumeMounts:
            - name: kms-root-keys
              mountPath: /var/run/secrets/moa-kms/root-keys
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: kms-root-keys
          secret:
            secretName: moa-kms-root-keys
