apiVersion: apps/v1
kind: Deployment
metadata:
  name: moa-edge
  namespace: moa-system
  labels:
    app.kubernetes.io/name: moa-edge
    app.kubernetes.io/part-of: moa
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: moa-edge
      app.kubernetes.io/part-of: moa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: moa-edge
        app.kubernetes.io/part-of: moa
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: edge
          image: ghcr.io/hwuiwon/moa-edge:latest
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 10
          env:
            - name: RUST_LOG
              value: warn,moa_orchestrator=info,moa_brain=info,moa_edge=info,async_openai::error=off
            # Stable for this process lifetime and unique across replicas. The
            # shared telemetry resource maps it to service.instance.id.
            - name: MOA_SERVICE_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: MOA_EDGE_BIND
              value: 0.0.0.0:8080
            - name: MOA_EDGE_UPSTREAM
              value: http://restate.moa-restate.svc.cluster.local:8080
            # Credential material takes a private, non-Restate path so it is
            # never persisted in the durable invocation journal.
            - name: MOA_EDGE_CONNECTOR_CREDENTIAL_UPSTREAM
              value: http://moa-orchestrator.moa-system.svc.cluster.local:10023
            # Stays dark until the connector-management rollout checkpoint.
            - name: MOA_EDGE_CONNECTOR_MANAGEMENT_ENABLED
              value: "false"
            - name: MOA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: moa-postgres
                  key: url
            # Three edge replicas reserve at most 24 runtime connections inside
            # the orchestrator's documented 1,200-connection fleet envelope.
            - name: MOA_EDGE_DB_MAX_CONNECTIONS
              value: "8"
            - name: MOA_EDGE_DB_MIN_CONNECTIONS
              value: "2"
            - name: MOA_EDGE_DB_ACQUIRE_TIMEOUT_SECONDS
              value: "2"
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
