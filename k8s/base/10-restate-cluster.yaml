apiVersion: restate.dev/v1
kind: RestateCluster
metadata:
  name: moa-restate
  namespace: moa-restate
spec:
  cluster:
    autoProvision: true
  compute:
    replicas: 3
    labels:
      moa.hwuiwon.com/restate-cluster: moa-restate
    image: docker.restate.dev/restatedev/restate:1.7.2
    resources:
      requests:
        cpu: "2"
        memory: 8Gi
      limits:
        cpu: "4"
        memory: 16Gi
  storage:
    storageRequestBytes: 214748364800
  security:
    allowOperatorAccessToAdmin: true
    networkPeers:
      ingress:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: moa-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: moa-edge
      node:
        # Alloy discovers and scrapes each Restate pod directly on the node
        # port. Keep this path inside the cluster without exposing it through a
        # load-balanced Service.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
      admin:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: moa-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: moa-orchestrator
  config: |
    auto-provision = false
    shutdown-timeout = "10m"
    default-num-partitions = 128
    default-replication = 2
    # v1.7 limitation: vqueues can only be enabled on a fresh cluster (no
    # in-flight invocations); a cluster with in-flight invocations will
    # refuse to boot with this flag set.
    experimental-enable-vqueues = true
