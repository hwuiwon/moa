apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: moa-orchestrator-ingress
  namespace: moa-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: moa-orchestrator
      app.kubernetes.io/part-of: moa
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: moa-restate
          podSelector:
            matchLabels:
              moa.dev/restate-cluster: moa-restate
      ports:
        - protocol: TCP
          port: 9080
    - ports:
        - protocol: TCP
          port: 9081
    # Opaque connector credential writes bypass Restate so secret bytes never
    # enter its journal. Only the trusted public edge may reach this listener.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: moa-edge
              app.kubernetes.io/part-of: moa
      ports:
        - protocol: TCP
          port: 10023
