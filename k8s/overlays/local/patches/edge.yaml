- op: replace
  path: /spec/replicas
  value: 1
- op: add
  path: /spec/template/spec/containers/0/imagePullPolicy
  value: Never
- op: replace
  path: /spec/template/spec/containers/0/resources
  value:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: MOA_AUTH_PROVIDER
    value: disabled
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: MOA_OBSERVABILITY_OTLP_ENDPOINT
    value: http://moa-lgtm.moa-system.svc.cluster.local:4317
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: MOA_OBSERVABILITY_SAMPLE_RATE
    value: "1.0"
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: MOA_OBSERVABILITY_ENVIRONMENT
    value: local
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: MOA_SESSION_ATTACHMENT_ENDPOINT
    value: http://rustfs:9000
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: MOA_SESSION_ATTACHMENT_BUCKET
    valueFrom:
      secretKeyRef:
        name: moa-session-attachments
        key: bucket
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: MOA_SESSION_ATTACHMENT_REGION
    valueFrom:
      secretKeyRef:
        name: moa-session-attachments
        key: region
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: MOA_SESSION_ATTACHMENT_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: moa-session-attachments
        key: access-key-id
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: MOA_SESSION_ATTACHMENT_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: moa-session-attachments
        key: secret-access-key
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: MOA_SESSION_ATTACHMENT_ALLOW_HTTP
    value: "true"
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: MOA_SESSION_ATTACHMENT_VIRTUAL_HOSTED_STYLE
    value: "false"
