apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: moa-system
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: moa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/part-of: moa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/part-of: moa
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          args:
            - valkey-server
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - valkey-cli
                - ping
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - valkey-cli
                - ping
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: moa-system
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: moa
spec:
  selector:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: moa
  ports:
    - name: redis
      port: 6379
      targetPort: redis
