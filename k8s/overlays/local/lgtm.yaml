# Development-only, single-pod observability backend. The upstream image is
# explicitly intended for local/demo/test use and all state is ephemeral.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moa-lgtm
  namespace: moa-system
  labels:
    app.kubernetes.io/name: moa-lgtm
    app.kubernetes.io/part-of: moa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: moa-lgtm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: moa-lgtm
        app.kubernetes.io/part-of: moa
    spec:
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.29.2
          imagePullPolicy: IfNotPresent
          env:
            # The upstream development image defaults to admin/admin. State the
            # local-only credentials explicitly so query tooling is deterministic.
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: PROMETHEUS_EXTRA_ARGS
              value: --storage.tsdb.retention.time=24h
          ports:
            - name: grafana
              containerPort: 3000
            - name: loki
              containerPort: 3100
            - name: tempo
              containerPort: 3200
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: prometheus
              containerPort: 9090
          readinessProbe:
            exec:
              command:
                - cat
                - /tmp/ready
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: lgtm-config
              mountPath: /otel-lgtm/grafana/conf/provisioning/datasources/moa-postgres.yaml
              subPath: postgres-datasource.yaml
              readOnly: true
            - name: tempo-data
              mountPath: /data/tempo
            - name: grafana-data
              mountPath: /data/grafana
            - name: loki-data
              mountPath: /data/loki
            - name: loki-storage
              mountPath: /loki
            - name: prometheus-data
              mountPath: /data/prometheus
            - name: pyroscope-data
              mountPath: /data/pyroscope
      volumes:
        - name: lgtm-config
          configMap:
            name: moa-local-lgtm-config
        - name: tempo-data
          emptyDir: {}
        - name: grafana-data
          emptyDir: {}
        - name: loki-data
          emptyDir: {}
        - name: loki-storage
          emptyDir: {}
        - name: prometheus-data
          emptyDir: {}
        - name: pyroscope-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: moa-lgtm
  namespace: moa-system
  labels:
    app.kubernetes.io/name: moa-lgtm
    app.kubernetes.io/part-of: moa
spec:
  selector:
    app.kubernetes.io/name: moa-lgtm
  ports:
    - name: grafana
      port: 3000
      targetPort: grafana
    - name: loki
      port: 3100
      targetPort: loki
    - name: tempo
      port: 3200
      targetPort: tempo
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: prometheus
      port: 9090
      targetPort: prometheus
