# Development-only, single-pod observability backend. The upstream image is
# explicitly intended for local/demo/test use and all state is ephemeral.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moa-lgtm
  namespace: moa-system
  labels:
    app.kubernetes.io/name: moa-lgtm
    app.kubernetes.io/part-of: moa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: moa-lgtm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: moa-lgtm
        app.kubernetes.io/part-of: moa
    spec:
      serviceAccountName: moa-lgtm
      # The local Restate overlay runs one node. Co-locating this development
      # collector lets its read-only host log mount see that node's CRI files;
      # production uses the dedicated Alloy deployment instead.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  moa.hwuiwon.com/restate-cluster: moa-restate
              namespaces:
                - moa-restate
              topologyKey: kubernetes.io/hostname
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.29.2
          imagePullPolicy: IfNotPresent
          env:
            # The upstream development image defaults to admin/admin. State the
            # local-only credentials explicitly so query tooling is deterministic.
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: PROMETHEUS_EXTRA_ARGS
              value: --storage.tsdb.retention.time=24h
            - name: OTELCOL_EXTRA_ARGS
              value: --config=file:/etc/moa/otelcol-local-restate.yaml
          ports:
            - name: grafana
              containerPort: 3000
            - name: loki
              containerPort: 3100
            - name: tempo
              containerPort: 3200
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: prometheus
              containerPort: 9090
          readinessProbe:
            exec:
              command:
                - cat
                - /tmp/ready
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: lgtm-config
              mountPath: /otel-lgtm/grafana/conf/provisioning/datasources/moa-postgres.yaml
              subPath: postgres-datasource.yaml
              readOnly: true
            - name: lgtm-config
              mountPath: /etc/moa/otelcol-local-restate.yaml
              subPath: otelcol-local-restate.yaml
              readOnly: true
            - name: host-pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: tempo-data
              mountPath: /data/tempo
            - name: grafana-data
              mountPath: /data/grafana
            - name: loki-data
              mountPath: /data/loki
            - name: loki-storage
              mountPath: /loki
            - name: prometheus-data
              mountPath: /data/prometheus
            - name: pyroscope-data
              mountPath: /data/pyroscope
      volumes:
        - name: lgtm-config
          configMap:
            name: moa-local-lgtm-config
        - name: tempo-data
          emptyDir: {}
        - name: grafana-data
          emptyDir: {}
        - name: loki-data
          emptyDir: {}
        - name: loki-storage
          emptyDir: {}
        - name: prometheus-data
          emptyDir: {}
        - name: pyroscope-data
          emptyDir: {}
        - name: host-pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: moa-lgtm
  namespace: moa-system
  labels:
    app.kubernetes.io/name: moa-lgtm
    app.kubernetes.io/part-of: moa
spec:
  selector:
    app.kubernetes.io/name: moa-lgtm
  ports:
    - name: grafana
      port: 3000
      targetPort: grafana
    - name: loki
      port: 3100
      targetPort: loki
    - name: tempo
      port: 3200
      targetPort: tempo
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: prometheus
      port: 9090
      targetPort: prometheus
---
# Local-only discovery grant for the collector's per-pod Restate scrape. It
# carries no Secret, ConfigMap, workload, or Admin API permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: moa-lgtm
  namespace: moa-system
  labels:
    app.kubernetes.io/name: moa-lgtm
    app.kubernetes.io/part-of: moa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: moa-local-lgtm-restate-discovery
  labels:
    app.kubernetes.io/name: moa-lgtm
    app.kubernetes.io/part-of: moa
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: moa-local-lgtm-restate-discovery
  labels:
    app.kubernetes.io/name: moa-lgtm
    app.kubernetes.io/part-of: moa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: moa-local-lgtm-restate-discovery
subjects:
  - kind: ServiceAccount
    name: moa-lgtm
    namespace: moa-system
