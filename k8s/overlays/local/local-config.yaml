apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: moa-system
data:
  001-enable-extensions.sql: |
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE EXTENSION IF NOT EXISTS pgaudit;
  002-create-openfga-db.sql: |
    SELECT 'CREATE DATABASE openfga OWNER moa_owner'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'openfga')\gexec
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: moa-loadtest-scripts
  namespace: moa-system
data:
  perf-gate.json: |
    {
      "default": {
        "completion": {
          "content": "OK",
          "duration_ms": 1,
          "input_tokens": 64,
          "cached_input_tokens": 0,
          "cache_write_input_tokens": 0,
          "tool_calls": []
        }
      }
    }
