apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: moa-system
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/part-of: moa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs
      app.kubernetes.io/part-of: moa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs
        app.kubernetes.io/part-of: moa
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:latest@sha256:fa19210ac4697c79d7ccca1ec9b0eb91aebacc6691991ffb14014bb3c67e6cc3
          args:
            - /data
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: moa-session-attachments
                  key: access-key-id
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: moa-session-attachments
                  key: secret-access-key
            - name: RUSTFS_REGION
              valueFrom:
                secretKeyRef:
                  name: moa-session-attachments
                  key: region
            - name: RUSTFS_ADDRESS
              value: 0.0.0.0:9000
            - name: RUSTFS_CONSOLE_ADDRESS
              value: 0.0.0.0:9001
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /health
              port: s3
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: s3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: s3
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: moa-system
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/part-of: moa
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: moa-system
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/part-of: moa
spec:
  selector:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/part-of: moa
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: batch/v1
kind: Job
metadata:
  # Job pod templates are immutable. This identity belongs to the initializer
  # revision which creates both the attachment and Restate snapshot buckets.
  name: rustfs-init-durable-buckets-v2
  namespace: moa-system
  labels:
    app.kubernetes.io/name: rustfs-init
    app.kubernetes.io/part-of: moa
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs-init
        app.kubernetes.io/part-of: moa
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rustfs-init
          image: rustfs/rc:latest@sha256:7e488f0b71de2f5152777cbc8a8dd5b8370d99d3019fbfc7e196bdc6e3fa0285
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until rc alias set --quiet --bucket-lookup path --region "${MOA_OBJECT_STORE_REGION}" rustfs http://rustfs:9000 "${MOA_OBJECT_STORE_ACCESS_KEY_ID}" "${MOA_OBJECT_STORE_SECRET_ACCESS_KEY}"; do
                sleep 1
              done
              rc bucket create --ignore-existing --region "${MOA_OBJECT_STORE_REGION}" "rustfs/${MOA_SESSION_ATTACHMENT_BUCKET}"
              rc bucket create --ignore-existing --region "${MOA_OBJECT_STORE_REGION}" "rustfs/${MOA_SANDBOX_CHECKPOINT_BUCKET}"
              rc bucket version info --json "rustfs/${MOA_SANDBOX_CHECKPOINT_BUCKET}" | grep -Eq '"enabled"[[:space:]]*:[[:space:]]*null'
              rc bucket create --ignore-existing --region "${MOA_OBJECT_STORE_REGION}" "rustfs/moa-restate-snapshots"
          env:
            - name: MOA_SESSION_ATTACHMENT_BUCKET
              valueFrom:
                secretKeyRef:
                  name: moa-session-attachments
                  key: bucket
            - name: MOA_OBJECT_STORE_REGION
              valueFrom:
                secretKeyRef:
                  name: moa-session-attachments
                  key: region
            - name: MOA_SANDBOX_CHECKPOINT_BUCKET
              valueFrom:
                secretKeyRef:
                  name: moa-session-attachments
                  key: checkpoint-bucket
            - name: MOA_OBJECT_STORE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: moa-session-attachments
                  key: access-key-id
            - name: MOA_OBJECT_STORE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: moa-session-attachments
                  key: secret-access-key
