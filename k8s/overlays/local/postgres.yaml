apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: moa-system
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: moa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: moa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: moa
    spec:
      containers:
        - name: postgres
          image: moa-postgres-age:kind
          imagePullPolicy: Never
          args:
            - postgres
            - -c
            - shared_preload_libraries=age,pgaudit
            - -c
            - session_preload_libraries=age
            - -c
            - wal_level=logical
            - -c
            - max_replication_slots=10
            - -c
            - max_wal_senders=10
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: moa
            - name: POSTGRES_USER
              value: moa_owner
            - name: POSTGRES_PASSWORD
              value: dev
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - moa_owner
                - -d
                - moa
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - moa_owner
                - -d
                - moa
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: moa-system
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: moa
spec:
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: moa
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
