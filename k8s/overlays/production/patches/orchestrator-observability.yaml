- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: MOA_OBSERVABILITY_OTLP_ENDPOINT
    value: http://alloy.observability.svc.cluster.local:4317
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: MOA_OBSERVABILITY_ENVIRONMENT
    value: production
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: MOA_LINEAGE_SINK
    value: postgres
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: MOA_MEMORY_RETRIEVAL_LINEAGE_SAMPLE_RATE
    value: "0.10"
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: MOA_PROVIDERS_CONCURRENCY_SCOPE
    value: global
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: MOA_PROVIDERS_PACING_SCOPE
    value: global
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: MOA_PROVIDERS_CONCURRENCY_ON_COORDINATION_FAILURE
    value: fail_closed
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: MOA_PROVIDERS_STREAM_TIMEOUTS_FIRST_BYTE_MS
    value: "30000"
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: MOA_PROVIDERS_STREAM_TIMEOUTS_IDLE_MS
    value: "60000"
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: MOA_PROVIDERS_STREAM_TIMEOUTS_TOTAL_MS
    value: "300000"
