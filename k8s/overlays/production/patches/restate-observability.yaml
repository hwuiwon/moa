- op: add
  path: /spec/storage/storageClassName
  value: fast-ssd
- op: add
  path: /spec/security/networkEgressRules
  value:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
      ports:
        - protocol: TCP
          port: 4319
- op: replace
  path: /spec/config
  value: |
    auto-provision = false
    shutdown-timeout = "10m"
    default-num-partitions = 128
    default-replication = 2
    [metadata-client]
    addresses = [
      "http://restate-0.restate-cluster.moa-restate.svc.cluster.local:5122",
      "http://restate-1.restate-cluster.moa-restate.svc.cluster.local:5122",
      "http://restate-2.restate-cluster.moa-restate.svc.cluster.local:5122",
    ]
    tracing-endpoint = "http://alloy.observability.svc.cluster.local:4319"
    tracing-filter = "warn,restate_ingress_http=info,restate_invoker_impl=info"
    log-filter = "warn,restate=info"
    log-format = "json"
    log-disable-ansi-codes = true
    [worker]
    durability-mode = "balanced"
    [worker.snapshots]
    snapshot-interval-num-records = 100000
    snapshot-interval = "60m"
    num-retained = 2
