apiVersion: v1
kind: ServiceAccount
metadata:
  name: moa-sandbox-workspace-object-store
  namespace: moa-system
  annotations:
    # render-production.sh replaces this sentinel with the dedicated Google
    # service account that has access only to the checkpoint bucket/prefix.
    iam.gke.io/gcp-service-account: sandbox-workspace-gsa-render-input
automountServiceAccountToken: true
