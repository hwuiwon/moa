apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: observability
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: moa
spec:
  # Exactly one. Two replicas behind one Service split the OTLP stream between
  # two independent write-ahead logs and two independent rule synchronizers -
  # each one reconciling Mimir's rule namespace against the same source and
  # fighting the other over it. The collector is not the availability boundary
  # here; the buffer on its PVC is.
  replicas: 1
  # The PVC is ReadWriteOnce, so a RollingUpdate would deadlock: the new pod
  # cannot attach the volume until the old pod releases it, and the old pod is
  # not terminated until the new one is Ready.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
      app.kubernetes.io/part-of: moa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
        app.kubernetes.io/part-of: moa
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          # Pinned to an exact release, read from the registry on 2026-07-28:
          # grafana/alloy:v1.18.0 is
          # sha256:491b0578c04983fd54fe99b587b6fab4404dc46d0dc16677bd6b00cc1140b308.
          # `latest` on a telemetry collector means a silent pipeline-semantics
          # change arrives with an unrelated pod restart.
          image: grafana/alloy:v1.18.0
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy
            - --server.http.listen-addr=0.0.0.0:12345
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: http
              containerPort: 12345
          envFrom:
            - secretRef:
                name: grafana-cloud
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: data
              mountPath: /var/lib/alloy
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: data
          persistentVolumeClaim:
            claimName: alloy-data
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  namespace: observability
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: moa
spec:
  selector:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: moa
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
